<body>

<header>
  <span class="brand">ORCA</span>
  <button class="filename" id="fileName" title="Open a different folder">no folder open</button>
  <span class="status" id="status"></span>
  <span class="spacer"></span>
  <span class="headline" id="headline"></span>
  <button class="btn sm" id="modeBtn" aria-pressed="false" title="Dim everything not signed off">Signed off</button>
  <div class="seg" id="viewSeg">
    <button data-view="map" aria-pressed="true">Map</button>
    <button data-view="graph" aria-pressed="false">Graph</button>
  </div>
  <button class="btn" id="presentBtn">Present</button>

  <button class="btn primary" id="saveBtn" disabled>Save</button>
</header>

<div id="banners"></div>

<main>
  <nav id="rail"></nav>
  <section id="stage"></section>
</main>

<div id="toasts"></div>
<button class="btn exit-present" id="exitPresent">Exit present</button>

<script type="module">
import {
  parseDocument, serializeDocument, verifyRoundTrip, refreshObjects,
  slug, CARDINALITIES, composeCardinality, parseCardinality,
  signOffCol, addSignOffColumn, isSigned, signRow, unsignRow,
  addObject, removeObject, renameObject, setNote, backlinks, blankMap,
  moveRow, moveObject, setRowTargets, ensureTable, deriveEdges,
  setNoteLabel, removeNote,
} from './parser.js';

/* ===========================================================================
   fs
   =========================================================================== */
const IDB = 'ooux', STORE = 'kv';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kv(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, mode);
    const req = fn(tx.objectStore(STORE));
    tx.oncomplete = () => res(req && 'result' in req ? req.result : undefined);
    tx.onerror = () => rej(tx.error);
  });
}
const kvGet = (k) => kv('readonly', (s) => s.get(k)).catch(() => undefined);
/**
 * Remembering something is a convenience; whatever the user just asked for is
 * the job. A storage failure — private browsing, blocked site data, a value
 * that will not structured-clone — must never take the folder down with it.
 */
const kvSet = (k, v) => kv('readwrite', (s) => s.put(v, k)).catch(() => undefined);

/** Read access is granted on pick; WRITE needs its own explicit grant. */
async function ensureWritable(handle) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return (await handle.requestPermission(opts)) === 'granted';
}

const fs = {
  async pickFolder() {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    await ensureWritable(dir);
    await kvSet('folder', dir);   // best effort; never blocks the open
    return dir;
  },
  async restoreFolder() {
    const dir = await kvGet('folder');
    if (!dir) return null;
    return (await dir.queryPermission({ mode: 'readwrite' })) === 'granted' ? dir : { needsGrant: dir };
  },
  async listMarkdown(dir) {
    const out = [];
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind === 'file' && name.toLowerCase().endsWith('.md')) out.push({ name, handle });
    }
    return out.sort((a, b) => a.name.localeCompare(b.name));
  },
  async read(handle) { return (await handle.getFile()).text(); },
  async write(handle, text) {
    const w = await handle.createWritable();
    await w.write(text);
    await w.close();
  },
};
async function backup(name, text) {
  const ring = (await kvGet('backup:' + name)) || [];
  ring.unshift({ at: new Date().toISOString(), text });
  await kvSet('backup:' + name, ring.slice(0, 10));
}

/* ===========================================================================
   state
   =========================================================================== */
const S = {
  dir: null, files: [], file: null, doc: null, originalText: '',
  readOnly: false, view: 'map', mode: 'normal', present: false,
  selected: null, dirty: false, onlyMaps: true,
  scroll: { map: 0, card: 0, source: 0, graph: 0 },
  graph: { focus: '', depth: 1, vb: null },
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);

/* A cell is one line of a markdown table row, so a newline or a bare pipe
   corrupts the file. Sanitise at the commit point, never at render. */
const oneLine = (s) => String(s).replace(/\r?\n+/g, ' ').replace(/\s{2,}/g, ' ').trim();
const cellSafe = (s) => oneLine(s).replace(/(?<!\\)\|/g, '\\|');

/* An annotation row carries no claim, so it can never be signed off. Counting
   them would stop the bar reaching 100% and make the headline wrong. */
const signable = (r) => r.kind !== 'annotation' && r.kind !== 'unknown';

/* Nothing may move under the cursor: hold scroll, focus and selection. */
function keepPlace(fn) {
  const stage = $('stage');
  const y = stage.scrollTop;
  const a = document.activeElement;
  const k = (a && a.dataset && a.dataset.row !== undefined)
    ? { row: a.dataset.row, col: a.dataset.col, card: a.dataset.card, s: a.selectionStart, e: a.selectionEnd }
    : null;
  fn();
  stage.scrollTop = y;
  if (!k) return;
  const el = stage.querySelector(k.card
    ? `[data-row="${k.row}"][data-card="1"]`
    : `.cell[data-row="${k.row}"][data-col="${k.col}"]`);
  if (!el) return;
  el.focus();
  if (k.s != null && el.setSelectionRange) { try { el.setSelectionRange(k.s, k.e); } catch {} }
}

/* Cmd-S must write the field being typed in, not just the model. */
function commitActive() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && typeof a.onchange === 'function') a.onchange({ target: a });
}

/* ===========================================================================
   ui chrome
   =========================================================================== */
function banner(kind, html, sticky) {
  const d = document.createElement('div');
  d.className = 'banner ' + kind;
  d.innerHTML = html + '<button class="x" title="Dismiss">×</button>';
  d.querySelector('.x').onclick = () => d.remove();
  (sticky ? $('banners') : $('toasts')).appendChild(d);
  if (!sticky) setTimeout(() => d.remove(), 5000);
  return d;
}
const clearBanners = () => ($('banners').innerHTML = '');

function setStatus() {
  const el = $('status');
  el.textContent = S.readOnly ? 'read-only' : S.dirty ? 'unsaved changes' : S.file ? 'saved' : '';
  el.className = 'status' + (S.dirty ? ' dirty' : '');
  $('saveBtn').disabled = !S.dirty || S.readOnly;
}

function signStats(doc) {
  let signed = 0, total = 0;
  for (const o of doc.objects) {
    if (!o.table) continue;
    const col = signOffCol(o.table);
    for (const r of o.table.rows) { if (!signable(r)) continue; total++; if (isSigned(r, col)) signed++; }
  }
  return { signed, total };
}
const pct = (st) => (st.total ? Math.round((st.signed / st.total) * 100) : 0);
function objSigned(o) {
  if (!o.table) return { signed: 0, total: 0 };
  const col = signOffCol(o.table);
  let s = 0, t = 0;
  for (const r of o.table.rows) { if (!signable(r)) continue; t++; if (isSigned(r, col)) s++; }
  return { signed: s, total: t };
}

function renderHeadline() {
  if (!S.doc) { $('headline').textContent = ''; return; }
  const st = signStats(S.doc);
  $('headline').innerHTML =
    `<span><b>${st.signed}</b> of ${st.total} signed</span>` +
    `<span class="sigbar"><i style="width:${pct(st)}%"></i></span>`;
}

function objCounts(obj) {
  const c = { core: 0, meta: 0, nested: 0, action: 0 };
  if (obj.table) for (const r of obj.table.rows) {
    if (r.kind === 'attribute') c[r.slot]++;
    else if (r.kind === 'relationship') c.nested++;
    else if (r.kind === 'action') c.action++;
  }
  return c;
}

function renderRail() {

  const rail = $('rail');
  rail.innerHTML = '';
  if (!S.files.length) return;

  const fh = document.createElement('div');
  fh.className = 'rail-h';
  fh.innerHTML = `<span>Files</span><span class="spacer" style="flex:1"></span>`;
  const tog = document.createElement('button');
  tog.className = 'btn sm';
  tog.textContent = S.onlyMaps ? 'maps' : 'all';
  tog.title = 'Show only files that parse as object maps';
  tog.onclick = () => { S.onlyMaps = !S.onlyMaps; renderRail(); };
  fh.appendChild(tog);
  const nu = document.createElement('button');
  nu.className = 'btn sm'; nu.textContent = '+';
  nu.title = 'Start a new object map in this folder';
  nu.onclick = newMap;
  fh.appendChild(nu);
  rail.appendChild(fh);

  for (const f of S.files) {
    if (S.onlyMaps && f.isMap === false) continue;
    const b = document.createElement('button');
    b.className = 'rail-item' + (f.isMap === false ? ' muted' : '');
    b.setAttribute('aria-current', S.file && S.file.name === f.name ? 'true' : 'false');
    b.title = f.name;
    b.innerHTML = `<span class="nm">${esc(f.name.replace(/\.md$/, ''))}</span>` +
      (f.objectCount ? `<span class="ct">${f.objectCount}</span>` : '');
    b.onclick = () => openFile(f);
    rail.appendChild(b);
  }

  if (!S.doc) return;
  const oh = document.createElement('div');
  oh.className = 'rail-h';
  oh.innerHTML = `<span>Objects</span><span class="ct" style="color:var(--faint);font-weight:400">${S.doc.objects.length}</span><span class="spacer" style="flex:1"></span>`;
  if (!S.readOnly) {
    const add = document.createElement('button');
    add.className = 'btn sm'; add.textContent = '+';
    add.title = 'Add an object';
    add.onclick = doAddObject;
    oh.appendChild(add);
  }
  rail.appendChild(oh);

  S.doc.objects.forEach((o, i) => {
    const st = objSigned(o);
    const wrap = document.createElement('div');
    wrap.className = 'rail-row';
    wrap.dataset.id = o.id;
    const b = document.createElement('button');
    b.className = 'rail-item';
    b.setAttribute('aria-current', S.selected === o.id ? 'true' : 'false');
    b.innerHTML = `<span class="nm" title="${esc(o.name)}">${esc(o.name)}</span><span class="ct">${st.total ? st.signed + '/' + st.total : ''}</span>`;
    b.onclick = () => goTo(o.id);
    wrap.appendChild(b);
    if (!S.readOnly) {
      const tools = document.createElement('span');
      tools.className = 'rail-tools';
      for (const [dir, glyph, title] of [[-1, '\u2191', 'Move up'], [1, '\u2193', 'Move down']]) {
        const mb = document.createElement('button');
        mb.className = 'movebtn';
        mb.innerHTML = glyph;
        mb.title = title;
        mb.disabled = (dir === -1 && i === 0) || (dir === 1 && i === S.doc.objects.length - 1);
        mb.onclick = (e) => {
          e.stopPropagation();
          if (!moveObject(S.doc, o.id, dir)) return;
          S.dirty = true; setStatus(); renderHeadline();
          renderRail();
          if (S.view === 'map') renderStage();
          const back = $('rail').querySelector(`.rail-row[data-id="${o.id}"] .movebtn[title="${title}"]`);
          if (back) back.focus();
        };
        tools.appendChild(mb);
      }
      wrap.appendChild(tools);
    }
    rail.appendChild(wrap);
  });
}

function goTo(id) {
  S.selected = id;
  S.view = 'card';
  S.scroll.card = 0;
  syncSegs(); renderStage(); renderRail();
  $('stage').scrollTop = 0;
  const sel = $('rail').querySelector('.rail-item[aria-current=true]');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

/* ===========================================================================
   stage
   =========================================================================== */
function renderStage() {
  const stage = $('stage');
  if (!S.doc) {
    stage.innerHTML = `<div class="welcome">
      <h1>ORCA</h1>
      <p>An OOUX object map you can edit — objects, attributes, actions and relationships,
      each row signed off once design and engineering agree on it.</p>
      <p style="margin-top:22px"><button class="btn primary" id="openBtn2">Open a folder</button></p>
      <p style="font-size:13px;color:var(--muted)">Pick any folder — an existing map opens straight away,
      and if there is nothing there yet you can start one with <b>+</b> next to Files.</p>
      <p style="font-size:12px;color:var(--faint);margin-top:26px">
        Markdown stays the source of truth. Nothing you did not edit is ever rewritten.</p>
    </div>`;
    const b = $('openBtn2'); if (b) b.onclick = openFolder;
    return;
  }
  if (S.view === 'map') return renderMap(stage);
  if (S.view === 'graph') return renderGraph(stage);
  if (S.view === 'source') return renderSource(stage);
  renderCard(stage);
}

function renderMap(stage) {
  if (!S.doc.objects.length) {
    stage.innerHTML = `<p class="empty-note" style="padding-top:24px">No objects in this file.</p>`;
    return;
  }
  let html = '<div class="grid">';
  for (const o of S.doc.objects) {
    const c = objCounts(o), st = objSigned(o);
    const parts = [];
    if (c.core) parts.push(`<span>${c.core} content</span>`);
    if (c.meta) parts.push(`<span>${c.meta} meta</span>`);
    if (c.nested) parts.push(`<span>${c.nested} nested</span>`);
    if (c.action) parts.push(`<span>${c.action} action${c.action === 1 ? '' : 's'}</span>`);
    const tail = st.total
      ? `<span style="margin-left:auto">${st.signed}/${st.total}</span>`
      : `<span style="margin-left:auto">not started</span>`;
    html += `<button class="mini" data-id="${esc(o.id)}" data-signed="${st.signed}">
      <h4 title="${esc(o.name)}">${esc(o.name)}</h4>
      <p class="def">${esc(o.definition ? o.definition.text.replace(/\*\*/g, '') : '')}</p>
      ${st.total ? `<div class="sigbar"><i style="width:${pct(st)}%"></i></div>` : ''}
      <div class="counts">${parts.join('')}${tail}</div>
    </button>`;
  }
  html += '</div>';
  stage.innerHTML = html;
  stage.querySelectorAll('.mini').forEach((el) => (el.onclick = () => goTo(el.dataset.id)));
}

function renderSource(stage) {
  const text = serializeDocument(S.doc);
  const obj = S.doc.objects.find((o) => o.id === S.selected);
  const marker = obj ? '#'.repeat(obj.level) + ' ' + obj.name : null;
  const lines = text.split('\n');
  let inObj = false;
  const out = lines.map((l, i) => {
    if (marker) {
      if (l.trim() === marker) inObj = true;
      else if (/^#{1,6}\s/.test(l)) inObj = false;
    }
    const n = `<span class="ln">${i + 1}</span>`;
    const body = esc(l) || ' ';
    return n + (inObj ? `<mark>${body}</mark>` : body);
  });
  stage.innerHTML = `<div class="sec-h" style="padding-top:20px">Markdown source${obj ? ' \u2014 highlighting ' + esc(obj.name) : ''}
    <span class="spacer" style="flex:1"></span><span class="ct" style="text-transform:none;letter-spacing:0">${text.length} bytes</span></div>
    <pre class="source">${out.join('\n')}</pre>`;
}

const SECTIONS = [
  { key: 'core', type: 'core', label: 'Core Content', match: (r) => r.kind === 'attribute' && r.slot === 'core' },
  { key: 'meta', type: 'meta', label: 'Metadata', match: (r) => r.kind === 'attribute' && r.slot === 'meta' },
  { key: 'action', type: 'action \u00b7 primary', label: 'Actions', match: (r) => r.kind === 'action' },
  { key: 'nested', type: 'nested', label: 'Nested Objects', match: (r) => r.kind === 'relationship' },
  { key: 'other', type: '', label: 'Annotations', match: (r) => r.kind === 'annotation' || r.kind === 'unknown' },
];

/* All five tables share one grid, so they line up with or without a header. */
/* ===========================================================================
   graph — the relationship view.

   Layout is deterministic: nodes start on a circle in file order and relax
   under a fixed number of force iterations, so the same file always draws the
   same picture and there are no hand positions to maintain.

   The glyphs carry the argument. A crow's foot means many, a bar means one,
   and an OPEN CIRCLE means nobody has stated that side — which on real data is
   most ends. A map made mostly of open circles should look like one.
   =========================================================================== */

function buildGraph(doc, focusId, depth) {
  const nodes = new Map();
  const put = (id, name, ghost) => {
    if (!nodes.has(id)) nodes.set(id, { id, name, ghost, w: 0, h: 26, x: 0, y: 0 });
    return nodes.get(id);
  };
  for (const o of doc.objects) put(o.id, o.name, false);

  const rowSigned = (owner, row) => {
    if (!owner.table) return false;
    const c = signOffCol(owner.table);
    return c >= 0 && isSigned(row, c);
  };
  const noteOf = (r) => r.cells[r.cols ? r.cols.note : 4] || '';

  const edges = [], directed = [];
  for (const e of deriveEdges(doc)) {
    const from = e.a.from, to = e.a.to;
    if (!nodes.has(to)) put(to, e.a.target.name, true);
    const signed = rowSigned(e.a.owner, e.a.row) && (!e.b || rowSigned(e.b.owner, e.b.row));
    edges.push({
      from, to,
      toKind: e.a.row.cardinality.kind,
      fromKind: e.b ? e.b.row.cardinality.kind : null,
      openEnd: e.openEnd, contested: e.contested, signed,
    });
    directed.push({ from, to, kind: e.a.row.cardinality.kind, raw: e.a.row.cardinality.raw,
      signed: rowSigned(e.a.owner, e.a.row), contested: e.contested, note: noteOf(e.a.row) });
    if (e.b) directed.push({ from: e.b.from, to: e.b.to, kind: e.b.row.cardinality.kind,
      raw: e.b.row.cardinality.raw, signed: rowSigned(e.b.owner, e.b.row), contested: e.contested,
      note: noteOf(e.b.row) });
  }

  let keep = null;
  if (focusId && nodes.has(focusId)) {
    keep = new Set([focusId]);
    for (let d = 0; d < depth; d++) {
      const ring = new Set(keep);
      for (const e of edges) {
        if (ring.has(e.from)) keep.add(e.to);
        if (ring.has(e.to)) keep.add(e.from);
      }
    }
  }
  const eds = keep ? edges.filter((e) => keep.has(e.from) && keep.has(e.to)) : edges;
  const dir = keep ? directed.filter((e) => keep.has(e.from) && keep.has(e.to)) : directed;
  const nds = keep ? [...nodes.values()].filter((n) => keep.has(n.id)) : [...nodes.values()];
  for (const n of nds) n.w = Math.max(64, Math.min(190, 16 + n.name.length * 7));
  return { nodes: nds, edges: eds, directed: dir, focusId: keep ? focusId : null };
}

/* rings: focused object at the centre, its neighbours on a ring around it.
   Crossing-free at depth 1, which is why it is the default once one object is
   in focus. */
function layoutRings(nodes, edges, focusId, W, H) {
  if (!nodes.length) return;
  const hub = nodes.find((n) => n.id === focusId) || nodes[0];
  hub.x = W / 2; hub.y = H / 2;
  const adj = new Map(nodes.map((n) => [n.id, new Set()]));
  for (const e of edges) {
    if (adj.has(e.from)) adj.get(e.from).add(e.to);
    if (adj.has(e.to)) adj.get(e.to).add(e.from);
  }
  const near = adj.get(hub.id) || new Set();
  const inner = nodes.filter((n) => n !== hub && near.has(n.id));
  const outer = nodes.filter((n) => n !== hub && !near.has(n.id));
  const ring = (list, r) => list.forEach((n, i) => {
    const a = (i / Math.max(1, list.length)) * Math.PI * 2 - Math.PI / 2;
    n.x = W / 2 + Math.cos(a) * r;
    n.y = H / 2 + Math.sin(a) * r;
  });
  ring(inner, Math.min(W, H) * 0.31);
  ring(outer, Math.min(W, H) * 0.47);
}

function layoutGraph(nodes, edges, W, H) {
  const n = nodes.length;
  if (!n) return;
  const R = Math.min(W, H) * 0.36;
  nodes.forEach((nd, i) => {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    nd.x = W / 2 + Math.cos(a) * R;
    nd.y = H / 2 + Math.sin(a) * R;
  });
  const byId = new Map(nodes.map((nd) => [nd.id, nd]));
  const links = edges.map((e) => ({ s: byId.get(e.from), t: byId.get(e.to) }))
    .filter((l) => l.s && l.t && l.s !== l.t);
  const ITER = 420;
  for (let it = 0; it < ITER; it++) {
    const k = 1 - it / ITER;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const A = nodes[i], B = nodes[j];
        let dx = B.x - A.x, dy = B.y - A.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { d2 = 1; dx = (i - j) || 1; dy = 1; }
        const d = Math.sqrt(d2);
        const rep = Math.min(40, 34000 / d2);
        dx /= d; dy /= d;
        A.x -= dx * rep * k; A.y -= dy * rep * k;
        B.x += dx * rep * k; B.y += dy * rep * k;
      }
    }
    for (const l of links) {
      let dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (d - 210) * 0.02 * k;
      dx /= d; dy /= d;
      l.s.x += dx * f; l.s.y += dy * f;
      l.t.x -= dx * f; l.t.y -= dy * f;
    }
    for (const nd of nodes) {
      nd.x += (W / 2 - nd.x) * 0.007 * k;
      nd.y += (H / 2 - nd.y) * 0.007 * k;
    }
  }
}

function boxExit(nd, tx, ty) {
  const dx = tx - nd.x, dy = ty - nd.y;
  if (!dx && !dy) return { x: nd.x, y: nd.y, ux: 1, uy: 0 };
  const hw = nd.w / 2 + 2, hh = nd.h / 2 + 2;
  const sx = dx ? hw / Math.abs(dx) : Infinity;
  const sy = dy ? hh / Math.abs(dy) : Infinity;
  const t = Math.min(sx, sy);
  const len = Math.sqrt(dx * dx + dy * dy);
  return { x: nd.x + dx * t, y: nd.y + dy * t, ux: dx / len, uy: dy / len };
}

function endGlyph(p, kind) {
  const x = p.x, y = p.y, ux = p.ux, uy = p.uy;
  const px = -uy, py = ux;
  const at = (d, o) => [x + ux * d + px * (o || 0), y + uy * d + py * (o || 0)];
  if (kind === null || kind === 'unknown') {
    const c = at(6, 0);
    return '<circle class="gl open" cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="3.6"/>';
  }
  if (kind === 'n/a') return '';
  if (kind === 'singular') {
    const a = at(5, -6), b = at(5, 6);
    return '<line class="gl" x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) +
           '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '"/>';
  }
  if (kind === 'other' || kind === 'range') {
    const t = at(11, 0);
    return '<text class="gq" x="' + t[0].toFixed(1) + '" y="' + (t[1] + 3).toFixed(1) + '" text-anchor="middle">?</text>';
  }
  const b = at(12, 0);
  return [-5.5, 0, 5.5].map((o) => {
    const e = at(0, o);
    return '<line class="gl" x1="' + b[0].toFixed(1) + '" y1="' + b[1].toFixed(1) +
           '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '"/>';
  }).join('');
}

const CARD_TOKEN = { singular: '1', '0-many': 'n', '1-many': '1n', range: 'r', other: '?', unknown: '-', 'n/a': '' };

/* grid: an adjacency matrix. No crossings, scales past 60 objects, and a blank
   cell facing a filled one is a question nobody has asked. */
function gridHtml(g) {
  const cols = g.nodes;
  const rows = g.nodes.filter((n) => !n.ghost);
  const key = (a, b) => a + ' ' + b;
  const cells = new Map();
  for (const d of g.directed) cells.set(key(d.from, d.to), d);
  const nameOf = new Map(g.nodes.map((n) => [n.id, n.name]));

  let h = '<table class="gmx" id="gmx"><colgroup><col class="rhcol">' +
    cols.map(() => '<col>').join('') + '</colgroup>';
  h += '<thead><tr><th class="corner"></th>';
  cols.forEach((c, ci) => {
    h += '<th class="vh ' + (c.ghost ? 'ghost' : '') + '" data-ci="' + ci + '"><span>' +
      esc(c.name) + '</span></th>';
  });
  h += '</tr></thead><tbody>';
  rows.forEach((r, ri) => {
    h += '<tr data-row="' + ri + '"><th class="rh"><button data-goto="' + esc(r.id) + '" title="' +
      esc(r.name) + '">' + esc(r.name) + '</button></th>';
    cols.forEach((c, ci) => {
      const pos = ' data-ri="' + ri + '" data-ci="' + ci + '"';
      if (r.id === c.id) {
        h += '<td class="self"' + pos + ' data-say="' + esc(r.name) + ' pointing at itself."></td>';
        return;
      }
      const f = cells.get(key(r.id, c.id));
      const back = cells.get(key(c.id, r.id));
      if (!f) {
        const say = back
          ? '<b>' + esc(c.name) + '</b> states a relationship to <b>' + esc(r.name) +
            '</b>, but this direction has never been stated.'
          : 'No stated relationship from <b>' + esc(r.name) + '</b> to <b>' + esc(c.name) + '</b>.';
        h += '<td class="' + (back ? 'inverse' : '') + '"' + pos + ' data-say="' + esc(say) + '"></td>';
        return;
      }
      const cls = ['mx', f.contested ? 'contested' : '', f.signed ? 'signed' : ''].join(' ');
      const tok = CARD_TOKEN[f.kind] !== undefined ? CARD_TOKEN[f.kind] : '?';
      const say = '<b>' + esc(r.name) + '</b> has ' + esc(PHRASE[f.kind] || f.raw || 'an unstated number of') +
        ' <b>' + esc(c.name) + '</b>' +
        (f.note ? ' &mdash; ' + esc(f.note) : '') +
        (f.signed ? ' <span class="tag signed">signed off</span>' : '') +
        (f.contested ? ' <span class="tag contested">the two sides disagree</span>' : '');
      h += '<td class="' + cls + '"' + pos + ' data-say="' + esc(say) + '">' + tok + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table>';
  return h;
}

const PHRASE = {
  singular: 'exactly one', '0-many': 'any number of', '1-many': 'at least one',
  range: 'a set number of', other: 'an unpinned number of', unknown: 'an unstated number of',
  'n/a': 'no',
};

function renderGraph(stage) {
  if (!S.doc.objects.length) {
    stage.innerHTML = '<p class="empty-note" style="padding-top:24px">No objects in this file.</p>';
    return;
  }
  const g = buildGraph(S.doc, S.graph.focus, S.graph.depth);
  const mode = S.graph.mode || (S.graph.focus ? 'rings' : 'grid');
  const open = g.edges.filter((e) => e.openEnd).length;
  const ghosts = g.nodes.filter((n) => n.ghost).length;

  const opts = ['<option value="">Everything</option>']
    .concat(S.doc.objects.map((o) =>
      '<option value="' + esc(o.id) + '" ' + (S.graph.focus === o.id ? 'selected' : '') + '>' +
      esc(o.name) + '</option>')).join('');

  const K = (hl, swatch, label) =>
    '<button class="ki" data-hl="' + hl + '">' + swatch + '<span>' + label + '</span></button>';
  const T = (tok, label) =>
    '<span class="ki"><span class="tok">' + tok + '</span><span>' + label + '</span></span>';
  const G = (t) => '<span class="grp">' + t + '</span>';

  let body = '', keyHtml = '', hint = '';

  if (mode === 'grid') {
    body = gridHtml(g);
    hint = 'Each cell says how many of the <b>column</b> object one <b>row</b> object has. Point at anything to read it in words.';
    keyHtml = G('Cell') + T('1', 'one') + T('n', 'many') + T('1n', 'at least one') +
      T('?', 'cannot be pinned down') +
      G('State') +
      K('stated', '<span class="sw"></span>', 'stated, not signed off') +
      K('signed', '<span class="sw signed"></span>', 'signed off') +
      K('contested', '<span class="sw contested"></span>', 'the two sides disagree') +
      K('inverse', '<span class="sw inv"></span>', 'only the opposite direction is stated');
  } else {
    const W = 1200, H = 760;
    const deg = new Map(g.nodes.map((n) => [n.id, 0]));
    for (const e of g.edges) {
      deg.set(e.from, (deg.get(e.from) || 0) + 1);
      if (e.to !== e.from) deg.set(e.to, (deg.get(e.to) || 0) + 1);
    }
    const linked = g.nodes.filter((n) => deg.get(n.id));
    const loose = g.nodes.filter((n) => !deg.get(n.id));
    if (mode === 'rings') layoutRings(linked, g.edges, g.focusId || (linked[0] && linked[0].id), W, H);
    else layoutGraph(linked, g.edges, W, H);

    if (loose.length) {
      let lx = Infinity, rx = -Infinity, by = -Infinity;
      for (const n of linked) {
        lx = Math.min(lx, n.x - n.w / 2); rx = Math.max(rx, n.x + n.w / 2); by = Math.max(by, n.y + n.h / 2);
      }
      if (!linked.length) { lx = 40; rx = W - 40; by = 40; }
      let cx = lx, cy = by + 76;
      for (const n of loose) {
        if (cx + n.w > rx && cx > lx) { cx = lx; cy += 40; }
        n.x = cx + n.w / 2; n.y = cy; cx += n.w + 14;
      }
    }

    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of g.nodes) {
      x0 = Math.min(x0, n.x - n.w / 2); x1 = Math.max(x1, n.x + n.w / 2);
      y0 = Math.min(y0, n.y - n.h / 2); y1 = Math.max(y1, n.y + n.h / 2);
    }
    const pad = 48;
    const box = g.nodes.length
      ? (x0 - pad).toFixed(0) + ' ' + (y0 - pad).toFixed(0) + ' ' +
        (x1 - x0 + pad * 2).toFixed(0) + ' ' + (y1 - y0 + pad * 2).toFixed(0)
      : '0 0 ' + W + ' ' + H;

    const byId = new Map(g.nodes.map((n) => [n.id, n]));
    let svg = '';
    for (const e of g.edges) {
      const a = byId.get(e.from), b = byId.get(e.to);
      if (!a || !b) continue;
      const cls = 'eg' + (e.contested ? ' contested' : e.signed ? ' signed' : '');
      const say = '<b>' + esc(a.name) + '</b> has ' + (PHRASE[e.toKind] || 'an unstated number of') +
        ' <b>' + esc(b.name) + '</b>' +
        (e.fromKind
          ? '; <b>' + esc(b.name) + '</b> has ' + (PHRASE[e.fromKind] || 'an unstated number of') +
            ' <b>' + esc(a.name) + '</b>'
          : '; nobody has stated what <b>' + esc(b.name) + '</b> has') +
        (e.signed ? ' <span class="tag signed">signed off</span>' : '') +
        (e.contested ? ' <span class="tag contested">the two sides disagree</span>' : '') +
        (e.openEnd && !e.contested ? ' <span class="tag open">one side unstated</span>' : '');
      svg += '<g class="egrp" data-say="' + esc(say) + '">';
      if (a === b) {
        svg += '<path class="' + cls + '" d="M ' + (a.x - 10).toFixed(1) + ' ' +
          (a.y - a.h / 2 - 2).toFixed(1) + ' a 26 26 0 1 1 20 0"/></g>';
        continue;
      }
      const pa = boxExit(a, b.x, b.y), pb = boxExit(b, a.x, a.y);
      svg += '<line class="' + cls + '" x1="' + pa.x.toFixed(1) + '" y1="' + pa.y.toFixed(1) +
        '" x2="' + pb.x.toFixed(1) + '" y2="' + pb.y.toFixed(1) + '"/>';
      svg += endGlyph(pb, e.toKind) + endGlyph(pa, e.fromKind) + '</g>';
    }
    if (loose.length) {
      const y = Math.min.apply(null, loose.map((n) => n.y)) - 26;
      const x = Math.min.apply(null, loose.map((n) => n.x - n.w / 2));
      svg += '<text x="' + x.toFixed(0) + '" y="' + y.toFixed(0) +
        '" class="gnote">connected to nothing yet</text>';
    }
    for (const n of g.nodes) {
      const cls = 'nd' + (n.ghost ? ' ghost' : '') + (n.id === (g.focusId || S.selected) ? ' sel' : '');
      const label = n.name.length > 24 ? n.name.slice(0, 23) + '…' : n.name;
      const nsay = '<b>' + esc(n.name) + '</b>' + (n.ghost
        ? ' — referenced here, defined in another file'
        : ' — click to open its card');
      svg += '<g class="' + cls + '" data-node="' + esc(n.id) + '" data-say="' + esc(nsay) + '">' +
        '<title>' + esc(n.name) + '</title>' +
        '<rect x="' + (n.x - n.w / 2).toFixed(1) + '" y="' + (n.y - n.h / 2).toFixed(1) +
        '" width="' + n.w + '" height="' + n.h + '" rx="6"/>' +
        '<text x="' + n.x.toFixed(1) + '" y="' + (n.y + 4).toFixed(1) + '" text-anchor="middle">' +
        esc(label) + '</text></g>';
    }
    body = '<svg class="graph" id="gSvg" viewBox="' + box +
      '" preserveAspectRatio="xMidYMid meet">' + svg + '</svg>';
    hint = 'Point at a line or a box to read the relationship in words.';
    keyHtml = G('Ends') +
      K('one', '<svg width="26" height="12"><line x1="0" y1="6" x2="16" y2="6"/><line x1="16" y1="0" x2="16" y2="12"/></svg>', 'one') +
      K('many', '<svg width="26" height="12"><line x1="0" y1="6" x2="10" y2="6"/><line x1="10" y1="6" x2="22" y2="0"/><line x1="10" y1="6" x2="22" y2="6"/><line x1="10" y1="6" x2="22" y2="12"/></svg>', 'many') +
      K('open', '<svg width="26" height="12"><line x1="0" y1="6" x2="14" y2="6"/><circle cx="19" cy="6" r="3.6" class="openswatch"/></svg>', 'this side never stated') +
      G('Line') +
      K('stated', '<svg width="26" height="12"><line x1="0" y1="6" x2="24" y2="6"/></svg>', 'stated, not signed off') +
      K('signed', '<svg width="26" height="12"><line class="sgn" x1="0" y1="6" x2="24" y2="6"/></svg>', 'signed off') +
      K('contested', '<svg width="26" height="12"><line class="ctd" x1="0" y1="6" x2="24" y2="6"/></svg>', 'the two sides disagree') +
      (ghosts ? G('Box') + K('ghost', '<span class="sw" style="border-style:dashed"></span>',
        'defined in another file (' + ghosts + ')') : '');
  }

  stage.innerHTML = '<div class="gbar">' +
      '<span class="sec-h" style="position:static;margin:0">Focus</span>' +
      '<select id="gFocus">' + opts + '</select>' +
      '<select id="gDepth" ' + (S.graph.focus ? '' : 'disabled') + '>' +
        '<option value="1" ' + (S.graph.depth === 1 ? 'selected' : '') + '>direct only</option>' +
        '<option value="2" ' + (S.graph.depth === 2 ? 'selected' : '') + '>two steps</option>' +
      '</select>' +
      '<div class="seg" id="gMode">' +
        '<button data-gmode="grid" aria-pressed="' + (mode === 'grid') + '" title="Adjacency matrix: every relationship, no crossing lines">Grid</button>' +
        '<button data-gmode="rings" aria-pressed="' + (mode === 'rings') + '" title="Focused object at the centre, neighbours around it">Rings</button>' +
        '<button data-gmode="web" aria-pressed="' + (mode === 'web') + '" title="Force layout: clusters, at the cost of crossings">Web</button>' +
      '</div>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<span class="note">' + g.nodes.length + ' objects &middot; ' + g.edges.length +
        ' relationships &middot; <b>' + open + '</b> with an unstated side</span>' +
      (mode === 'grid' ? '' : '<button class="btn sm" id="gFit">Fit</button>') +
    '</div>' +
    '<div class="gframe" id="gFrame">' +
      '<div class="gbody">' + body + '</div>' +
      '<div class="greadout" id="gRead"><span class="hint">' + hint + '</span></div>' +
      '<div class="gkey">' + keyHtml + '</div>' +
    '</div>';

  wireGraph(mode, hint);
}

function wireGraph(mode, hint) {
  const frame = $('gFrame'), read = $('gRead');
  const say = (html) => (read.innerHTML = html || '<span class="hint">' + hint + '</span>');

  $('gFocus').onchange = (e) => {
    S.graph.focus = e.target.value;
    if (!S.graph.focus && S.graph.mode === 'rings') S.graph.mode = 'grid';
    if (S.graph.focus && S.graph.mode === 'grid') S.graph.mode = 'rings';
    renderGraph($('stage'));
  };
  $('gDepth').onchange = (e) => { S.graph.depth = +e.target.value; renderGraph($('stage')); };
  document.querySelectorAll('#gMode button').forEach((b) =>
    (b.onclick = () => { S.graph.mode = b.dataset.gmode; renderGraph($('stage')); }));
  $('stage').querySelectorAll('.rh [data-goto]').forEach((el) =>
    (el.onclick = () => goTo(el.dataset.goto)));

  // the key is a control, not a caption: pointing at an item dims the rest
  frame.querySelectorAll('.ki[data-hl]').forEach((el) => {
    el.onmouseenter = () => frame.setAttribute('data-hl', el.dataset.hl);
    el.onfocus = () => frame.setAttribute('data-hl', el.dataset.hl);
    el.onmouseleave = () => frame.removeAttribute('data-hl');
    el.onblur = () => frame.removeAttribute('data-hl');
    el.onclick = () => {
      const on = frame.dataset.stick === el.dataset.hl;
      if (on) { delete frame.dataset.stick; frame.removeAttribute('data-hl'); }
      else { frame.dataset.stick = el.dataset.hl; frame.setAttribute('data-hl', el.dataset.hl); }
    };
  });

  if (mode === 'grid') {
    const tbl = $('gmx');
    const cols = tbl.querySelectorAll('colgroup col');
    const clear = () => {
      tbl.querySelectorAll('.xrow').forEach((n) => n.classList.remove('xrow'));
      tbl.querySelectorAll('.xcell').forEach((n) => n.classList.remove('xcell'));
      tbl.querySelectorAll('.xhead').forEach((n) => n.classList.remove('xhead'));
      cols.forEach((c) => c.classList.remove('xcol'));
    };
    tbl.addEventListener('mouseover', (e) => {
      const td = e.target.closest('td[data-ri]');
      if (!td) return;
      clear();
      td.classList.add('xcell');
      td.closest('tr').classList.add('xrow');
      const ci = +td.dataset.ci;
      if (cols[ci + 1]) cols[ci + 1].classList.add('xcol');
      const th = tbl.querySelector('thead th[data-ci="' + ci + '"]');
      if (th) th.classList.add('xhead');
      say(td.dataset.say);
    });
    tbl.addEventListener('mouseleave', () => { clear(); say(''); });
    return;
  }

  const svg = $('gSvg');
  const home = svg.getAttribute('viewBox');
  $('gFit').onclick = () => svg.setAttribute('viewBox', home);
  svg.addEventListener('mouseover', (e) => {
    const t = e.target.closest('[data-say]');
    if (t) say(t.dataset.say);
  });
  svg.addEventListener('mouseleave', () => say(''));
  svg.querySelectorAll('[data-node]').forEach((el) => {
    el.onclick = () => {
      const id = el.dataset.node;
      if (S.doc.objects.some((o) => o.id === id)) goTo(id);
    };
  });
  const vb = () => svg.getAttribute('viewBox').split(/\s+/).map(Number);
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const b = vb(), x = b[0], y = b[1], w = b[2], h = b[3];
    const f = e.deltaY > 0 ? 1.12 : 1 / 1.12;
    const r = svg.getBoundingClientRect();
    const mx = x + ((e.clientX - r.left) / r.width) * w;
    const my = y + ((e.clientY - r.top) / r.height) * h;
    svg.setAttribute('viewBox', (mx - (mx - x) * f) + ' ' + (my - (my - y) * f) + ' ' + (w * f) + ' ' + (h * f));
  }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', (e) => {
    if (e.target.closest('[data-node]')) return;
    drag = { x: e.clientX, y: e.clientY, vb: vb() };
    svg.classList.add('drag');
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    const x = drag.vb[0], y = drag.vb[1], w = drag.vb[2], h = drag.vb[3];
    svg.setAttribute('viewBox',
      (x - ((e.clientX - drag.x) / r.width) * w) + ' ' +
      (y - ((e.clientY - drag.y) / r.height) * h) + ' ' + w + ' ' + h);
  });
  const stop = () => { drag = null; svg.classList.remove('drag'); };
  svg.addEventListener('pointerup', stop);
  svg.addEventListener('pointercancel', stop);
}

/* The Example column is optional — a map that has no `Example` header gets the
   original six-column layout. Both the colgroup and the header row have to agree
   with what renderStage actually emits per row, so they are built from the same
   flag rather than being constants. */
const COLS = (ex) => `<colgroup><col style="width:22px"><col style="width:${ex ? 24 : 26}%">` +
  `<col style="width:116px">${ex ? '<col style="width:150px">' : ''}<col>` +
  `<col style="width:64px"><col style="width:22px"></colgroup>`;
const THEAD = (ex) => `<thead><tr><th></th><th>Name</th><th>Cardinality</th>` +
  `${ex ? '<th>Example</th>' : ''}<th>Note</th><th>Sign-off</th><th></th></tr></thead>`;

/* The next row in the SAME section, or -1 at a section boundary — moving a
   row across a boundary would silently retype it. */
function sectionNeighbour(table, i, dir) {
  const sec = SECTIONS.find((sc) => sc.match(table.rows[i]));
  if (!sec) return -1;
  for (let j = i + dir; j >= 0 && j < table.rows.length; j += dir) if (sec.match(table.rows[j])) return j;
  return -1;
}

function doMove(obj, i, dir) {
  const j = sectionNeighbour(obj.table, i, dir);
  if (j < 0) return;
  const a = document.activeElement;
  const col = (a && a.dataset && a.dataset.row === String(i)) ? a.dataset.col : undefined;
  const y = $('stage').scrollTop;
  if (!moveRow(obj.table, i, j)) return;
  markDirty();
  renderStage();
  const stage = $('stage');
  stage.scrollTop = y;
  const tr = stage.querySelector(`tr[data-idx="${j}"]`);
  if (!tr) return;
  tr.classList.add('justmoved');
  tr.scrollIntoView({ block: 'nearest' });
  const t = col !== undefined
    ? tr.querySelector(`.cell[data-col="${col}"]`)
    : tr.querySelector(`[data-move][data-dir="${dir}"]`);
  if (t) t.focus();
}

function cardOptions(raw) {
  const known = CARDINALITIES.some((c) => c.value === raw);
  const base = CARDINALITIES.map((c) =>
    `<option value="${esc(c.value)}" ${c.value === raw ? 'selected' : ''}>${esc(c.label)}</option>`).join('');
  if (known) return base;
  const parsed = parseCardinality(raw);
  if (['singular', '0-many', 'range'].includes(parsed.kind) && !parsed.qualifier && !parsed.uncertain) {
    return CARDINALITIES.map((c) =>
      `<option value="${esc(c.value)}" ${c.value === parsed.kind ? 'selected' : ''}>${esc(c.label)}</option>`).join('');
  }
  // A kept value like "0-many payees per contract" would otherwise set the
  // intrinsic width of the whole column.
  const label = esc(raw.replace(/\*\*/g, '').slice(0, 24)) || 'not asked';
  return base + `<option value="${esc(raw)}" selected title="${esc(raw)}">${label} (kept)</option>`;
}

function renderCard(stage) {
  const obj = S.doc.objects.find((o) => o.id === S.selected) || S.doc.objects[0];
  if (!obj) {
    stage.innerHTML = `<p class="empty-note" style="padding-top:24px">No objects in this file.</p>` +
      (S.readOnly ? '' : `<p><button class="btn" id="addFirst">+ Add an object</button></p>`);
    const a = $('addFirst'); if (a) a.onclick = doAddObject;
    return;
  }
  S.selected = obj.id;
  const idx = S.doc.objects.indexOf(obj);
  const prev = S.doc.objects[idx - 1], next = S.doc.objects[idx + 1];
  const ro = S.readOnly;
  const col = obj.table ? signOffCol(obj.table) : -1;
  const C = obj.table ? obj.table.cols : { type: 0, name: 1, cardinality: 2, note: 4 };
  const rows = obj.table ? obj.table.rows : [];
  const st = objSigned(obj);

  // Neighbour names live in titles, not labels — as labels they changed the
  // bar's geometry on every object.
  let html = `<div class="cardnav">
    <button class="btn navbtn" id="prevObj" ${prev ? '' : 'disabled'} title="${prev ? 'Previous: ' + esc(prev.name) + ' (←)' : 'First object'}">&lsaquo;</button>
    <button class="btn navbtn" id="nextObj" ${next ? '' : 'disabled'} title="${next ? 'Next: ' + esc(next.name) + ' (→)' : 'Last object'}">&rsaquo;</button>
    <input id="nameIn" value="${esc(obj.name)}" ${ro ? 'readonly' : ''} title="Object name">
    <span class="pos">${idx + 1} of ${S.doc.objects.length}</span>
    <span class="spacer" style="flex:1"></span>
    <span class="prog">${st.signed} of ${st.total} signed</span>
    <div class="sigbar"><i style="width:${pct(st)}%"></i></div>
  </div>
  <article class="card">
    <textarea class="ta" id="defEdit" ${ro ? 'readonly' : ''}
      placeholder="No definition yet.">${esc(obj.definition ? obj.definition.text : '')}</textarea>`;

  // The labelled notes are the most interview-useful prose on the card, so
  // they read before the rows rather than after them.
  // Notes: label + body, both editable, add and delete. One concept, one place.
  html += `<section class="sec sec-notes"><div class="sec-h">Notes` +
    `<span class="ct">${obj.notes.length || ''}</span><span class="spacer" style="flex:1"></span>` +
    (ro ? '' : `<button class="btn add" id="addNote">+ note</button>`) + `</div>`;
  if (obj.notes.length) {
    html += `<div class="notes">`;
    for (const n of obj.notes) {
      html += `<div class="nrow">` +
        `<input class="nlbl" data-notelabel="${esc(n.label)}" value="${esc(n.label)}" ${ro ? 'readonly' : ''} title="Label">` +
        `<textarea class="ta nbody" data-note="${esc(n.label)}" ${ro ? 'readonly' : ''}>${esc(n.body)}</textarea>` +
        (ro ? '' : `<button class="rowbtn ndel" data-notedel="${esc(n.label)}" title="Delete this note">&times;</button>`) +
        `</div>`;
    }
    html += `</div>`;
  }
  html += `</section>`;

  let headed = false;
  for (const sec of SECTIONS) {
    const list = rows.map((r, i) => ({ r, i })).filter(({ r }) => sec.match(r));
    if (!list.length && sec.key === 'other') continue;
    html += `<section class="sec sec-${sec.key}"><div class="sec-h">${sec.label}` +
      `<span class="ct">${list.length || ''}</span><span class="spacer" style="flex:1"></span>` +
      (ro ? '' : `<button class="btn add" data-add="${sec.key}">+ row</button>`) + `</div>`;
    if (list.length) {
      const hasEx = C.example >= 0;
      const thead = headed ? '' : (headed = true, THEAD(hasEx));
      html += `<table class="rows">${COLS(hasEx)}${thead}<tbody>`;
      for (const { r, i } of list) {
        const signed = signable(r) && isSigned(r, col);
        const lock = signed || ro ? 'disabled' : '';
        const up = sectionNeighbour(obj.table, i, -1) < 0 ? 'disabled' : '';
        const dn = sectionNeighbour(obj.table, i, 1) < 0 ? 'disabled' : '';
        html += `<tr data-idx="${i}" class="${signed ? 'signed' : ''} ${r.dirty ? 'rowdirty' : ''}">
          <td class="g-move">${ro ? '' : `<button class="movebtn" data-move="${i}" data-dir="-1" title="Move up (Alt+↑)" ${up}>&uarr;</button><button class="movebtn" data-move="${i}" data-dir="1" title="Move down (Alt+↓)" ${dn}>&darr;</button>`}</td>
          ${r.kind === 'relationship'
            ? `<td class="c-name rel">${targetChips(r, i, ro || signed)}</td>`
            : `<td class="c-name"><textarea class="cell nm" rows="1" data-row="${i}" data-col="${C.name}" ${lock}>${esc(r.cells[C.name])}</textarea></td>`}
          <td>
            <select class="cell card" data-row="${i}" data-card="1" ${lock}>${cardOptions(r.cells[C.cardinality])}</select>
            ${r.cardinality.qualifier ? `<div class="qualchip">${esc(r.cardinality.qualifier)}</div>` : ''}
          </td>
          ${C.example >= 0 ? `<td><textarea class="cell example" rows="1" data-row="${i}" data-col="${C.example}" ${lock} placeholder="—">${esc(r.cells[C.example] || '')}</textarea></td>` : ''}
          <td><textarea class="cell note" rows="1" data-row="${i}" data-col="${C.note}" ${lock}>${esc(r.cells[C.note])}</textarea></td>
          <td class="g-sign">${signable(r) ? `<button class="lockbtn ${signed ? 'on' : ''}" data-lock="${i}" aria-pressed="${signed}" ${ro ? 'disabled' : ''} title="${signed ? 'Signed ' + esc((r.cells[col] || '').replace(/^signed /, '')) + ' — click to unlock' : 'Sign off on this row'}">&#10003;</button>` : ''}</td>
          <td class="g-del">${ro ? '' : `<button class="rowbtn" data-del="${i}" title="Delete row" ${signed ? 'disabled' : ''}>&times;</button>`}</td>
        </tr>`;
      }
      html += '</tbody></table>';
    }
    html += `</section>`;
  }

  const back = backlinks(S.doc, obj.id);
  if (back.length) {
    html += `<section class="sec"><div class="sec-h">Referenced by<span class="ct">${back.length}</span></div>`;
    for (const b of back) {
      html += `<div class="backlink">
        <button data-goto="${esc(b.from.id)}">${esc(b.from.name)}</button>
        <span class="c">${esc(b.row.cardinality.raw.replace(/\*\*/g, ''))}</span>
        <span class="c">${esc(b.row.cells[b.row.cols ? b.row.cols.note : 4] || '')}</span></div>`;
    }
    html += `</section>`;
  }

  html += `<div class="cardfoot">
    <span style="flex:1"></span>
    ${ro ? '' : '<button class="linkbtn" id="delObj">Delete this object</button>'}
  </div></article>`;

  html += `<datalist id="objNames">${S.doc.objects.map((o) => `<option value="${esc(o.name)}"></option>`).join('')}</datalist>`;
  stage.innerHTML = html;
  wireCard(obj, col, prev, next, C);
}

/**
 * A relationship cell IS its chips — the `[[#Name]]` and `**Name**` syntax is
 * never shown and never typed. The chip label navigates, × removes, + adds.
 */
function targetChips(row, i, locked) {
  let html = '<div class="chips">';
  row.targets.forEach((t, k) => {
    const id = slug(t.name);
    const live = S.doc.objects.some((o) => o.id === id);
    html += `<span class="chip ${live ? '' : 'ghost'}" title="${live ? 'Go to ' + esc(t.name) : esc(t.name) + ' — not an object in this file'}">` +
      (live
        ? `<button class="tlbl" data-goto="${esc(id)}">${esc(t.name)}</button>`
        : `<span class="tlbl">${esc(t.name)}</span>`) +
      (locked ? '' : `<button class="chipx" data-untarget="${i}" data-k="${k}" title="Remove">&times;</button>`) +
      `</span>`;
  });
  if (row.label) html += `<span class="lbltext">${esc(row.label)}</span>`;
  if (!locked) html += `<button class="addtarget" data-addtarget="${i}" title="Add a related object">+</button>`;
  html += '</div>';
  return html;
}

function wireCard(obj, col, prev, next, C) {
  const stage = $('stage');
  const P = $('prevObj'), N = $('nextObj');
  if (P && prev) P.onclick = () => goTo(prev.id);
  if (N && next) N.onclick = () => goTo(next.id);
  stage.querySelectorAll('[data-goto]').forEach((el) => (el.onclick = () => goTo(el.dataset.goto)));
  if (S.readOnly) return;

  const nameIn = $('nameIn');
  nameIn.onchange = () => {
    const v = oneLine(nameIn.value);
    if (!v || v === obj.name) { nameIn.value = obj.name; return; }
    const r = renameObject(S.doc, obj.id, v);
    S.selected = slug(v);
    markDirty();
    if (r.rewritten) banner('ok', `Renamed. Rewrote <b>${r.rewritten}</b> reference${r.rewritten === 1 ? '' : 's'} to <code>[[#${esc(r.oldName)}]]</code>.`);
    keepPlace(() => { renderStage(); renderRail(); });
    const n2 = $('nameIn'); if (n2) n2.focus();
  };

  $('defEdit').onchange = (e) => {
    if (!obj.definition) { banner('warn', 'No <code>**Definition:**</code> line to edit. Add one in Obsidian and reopen.', true); return; }
    const v = oneLine(e.target.value);
    if (obj.definition.text === v) return;
    obj.definition.text = v;
    obj.definition.dirty = true;
    markDirty();
  };

  stage.querySelectorAll('textarea[data-note]').forEach((el) => {
    el.onchange = () => {
      const v = oneLine(el.value);
      const label = el.dataset.note;
      const cur = obj.notes.find((n) => n.label === label);
      if (cur && cur.body === v) return;
      setNote(obj, label, v);
      markDirty();
      if (!v) keepPlace(() => renderStage());
    };
  });

  stage.querySelectorAll('input[data-notelabel]').forEach((el) => {
    el.onchange = () => {
      const from = el.dataset.notelabel;
      const to = oneLine(el.value).replace(/:+$/, '');
      if (!to) { el.value = from; return; }
      if (to !== from && obj.notes.some((n) => n.label === to)) {
        banner('warn', `There is already a note labelled <b>${esc(to)}</b>.`);
        el.value = from; return;
      }
      if (setNoteLabel(obj, from, to)) { markDirty(); keepPlace(() => renderStage()); }
    };
  });

  stage.querySelectorAll('[data-notedel]').forEach((el) => {
    el.onclick = () => {
      if (!confirm('Delete this note?')) return;
      removeNote(obj, el.dataset.notedel);
      markDirty();
      keepPlace(() => renderStage());
    };
  });

  const addNote = $('addNote');
  if (addNote) addNote.onclick = () => {
    let label = 'Note', i = 2;
    while (obj.notes.some((n) => n.label === label)) label = 'Note ' + i++;
    setNote(obj, label, ' ');
    markDirty();
    renderStage();
    const fresh = $('stage').querySelector(`input[data-notelabel="${label}"]`);
    if (fresh) { fresh.focus(); fresh.select(); }
  };

  // Text edits never re-render — that is what keeps focus and scroll.
  stage.querySelectorAll('.cell[data-col]').forEach((el) => {
    el.onchange = () => {
      const row = obj.table.rows[+el.dataset.row];
      const c = +el.dataset.col;
      const v = cellSafe(el.value);
      if (row.cells[c] === v) return;
      row.cells[c] = v;
      if (el.value !== v) el.value = v;
      row.dirty = true;
      el.closest('tr').classList.add('rowdirty');
      markDirty();
    };
  });

  stage.querySelectorAll('select[data-card]').forEach((el) => {
    el.onchange = () => {
      const row = obj.table.rows[+el.dataset.row];
      const keep = row.cardinality.qualifier || '';
      row.cells[C.cardinality] = composeCardinality(el.value, keep, row.cardinality.uncertain);
      row.cardinality = parseCardinality(row.cells[C.cardinality]);
      row.dirty = true;
      el.closest('tr').classList.add('rowdirty');
      markDirty();
    };
  });

  stage.querySelectorAll('[data-move]').forEach((el) => {
    el.onclick = () => doMove(obj, +el.dataset.move, +el.dataset.dir);
  });

  // remove one target from a relationship row
  stage.querySelectorAll('[data-untarget]').forEach((el) => {
    el.onclick = () => {
      const row = obj.table.rows[+el.dataset.untarget];
      const keep = row.targets.filter((_, k) => k !== +el.dataset.k);
      setRowTargets(row, keep, row.label);
      markDirty();
      keepPlace(() => renderStage());
    };
  });

  // add a target: pick an existing object or type a new name — never syntax
  stage.querySelectorAll('[data-addtarget]').forEach((el) => {
    el.onclick = () => {
      const i = +el.dataset.addtarget;
      const inp = document.createElement('input');
      inp.className = 'tgtinput';
      inp.setAttribute('list', 'objNames');
      inp.placeholder = 'object name';
      el.replaceWith(inp);
      inp.focus();
      let done = false;
      const commit = (ok) => {
        if (done) return; done = true;
        const v = ok ? oneLine(inp.value).replace(/^\[\[#|\]\]$/g, '').replace(/^\*\*|\*\*$/g, '').trim() : '';
        if (!v) { keepPlace(() => renderStage()); return; }
        const row = obj.table.rows[i];
        if (row.targets.some((t) => slug(t.name) === slug(v))) {
          banner('warn', `<b>${esc(v)}</b> is already on that row.`);
          keepPlace(() => renderStage()); return;
        }
        let scope = 'internal';
        if (!S.doc.objects.some((o) => o.id === slug(v))) {
          scope = confirm(`There is no object called "${v}" in this file.\n\nOK = create it now.\nCancel = keep it as a reference to something outside this file.`)
            ? (addObject(S.doc, v), 'internal')
            : 'external';
        }
        setRowTargets(row, [...row.targets, { name: v, scope }], row.label);
        markDirty();
        keepPlace(() => { renderStage(); renderRail(); });
      };
      inp.onkeydown = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(true); }
        if (e.key === 'Escape') { e.preventDefault(); commit(false); }
      };
      inp.onblur = () => commit(true);
    };
  });

  // Sign-off mutates the row in place; a full re-render would blank the card.
  stage.querySelectorAll('[data-lock]').forEach((el) => {
    el.onclick = () => {
      const i = +el.dataset.lock, row = obj.table.rows[i];
      let c = signOffCol(obj.table);
      if (c < 0) {
        if (!confirm('This file has no Sign-off column yet.\n\nAdding one rewrites this table once. Every edit after that is a one-line change again.\n\nAdd it?')) return;
        c = addSignOffColumn(obj.table);
        signRow(row, c, today());
        markDirty();
        keepPlace(() => renderStage());
        return;
      }
      if (isSigned(row, c)) {
        if (!confirm('Unlock this row so it can be edited again?')) return;
        unsignRow(row, c);
      } else signRow(row, c, today());

      const on = isSigned(row, c), tr = el.closest('tr');
      tr.classList.toggle('signed', on);
      tr.classList.add('rowdirty');
      tr.querySelectorAll('.cell').forEach((n) => (n.disabled = on));
      const del = tr.querySelector('[data-del]'); if (del) del.disabled = on;
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', on);
      el.title = on
        ? 'Signed ' + (row.cells[c] || '').replace(/^signed /, '') + ' — click to unlock'
        : 'Sign off on this row';
      markDirty();
      el.focus();
    };
  });

  stage.querySelectorAll('[data-del]').forEach((el) => {
    el.onclick = () => {
      if (!confirm('Delete this row?')) return;
      const i = +el.dataset.del;
      obj.table.rows.splice(i, 1);
      markDirty();
      keepPlace(() => renderStage());
      const back = $('stage').querySelector(`.cell[data-row="${i}"][data-col="${C.name}"]`)
        || $('stage').querySelector(`.cell[data-row="${i - 1}"][data-col="${C.name}"]`);
      if (back) back.focus();
    };
  });

  stage.querySelectorAll('[data-add]').forEach((el) => {
    el.onclick = () => addRow(obj, SECTIONS.find((sc) => sc.key === el.dataset.add).type, C);
  });

  $('delObj').onclick = () => {
    if (!confirm(`Delete the object "${obj.name}"?\n\nThis removes it from the file when you save.`)) return;
    const i = S.doc.objects.indexOf(obj);
    removeObject(S.doc, obj.id);
    const nextSel = S.doc.objects[Math.max(0, i - 1)];
    S.selected = nextSel ? nextSel.id : null;
    markDirty(); renderStage(); renderRail();
  };
}

function addRow(obj, type, C) {
  if (!obj.table) {
    // A definition-only object gets its table on first use, matching the
    // columns already used elsewhere in this file.
    const model = S.doc.objects.find((o) => o.table);
    ensureTable(obj, model && model.table ? model.table.headerCells : null);
  }
  const cols = obj.table.cols;
  const cells = new Array(obj.table.colCount).fill('');
  cells[cols.type] = type;
  const row = {
    src: '\n', dirty: true, cells, cols,
    kind: type === 'nested' ? 'relationship' : type.startsWith('action') ? 'action' : type ? 'attribute' : 'annotation',
    slot: type === 'core' ? 'core' : type === 'meta' ? 'meta' : null,
    priority: type.startsWith('action') ? 'primary' : null,
    name: '', targets: [], label: null,
    cardinality: { raw: '', kind: 'unknown', qualifier: null, uncertain: false },
    evidence: { state: 'unasked', grade: null, raw: '' },
    note: '', who: '', refs: { questions: [], dates: [], links: [] },
  };
  row.cols = cols;
  let at = obj.table.rows.length;
  for (let i = obj.table.rows.length - 1; i >= 0; i--) {
    if (obj.table.rows[i].cells[cols.type] === type) { at = i + 1; break; }
  }
  obj.table.rows.splice(at, 0, row);
  markDirty();
  keepPlace(() => renderStage());
  const inp = $('stage').querySelector(`.cell[data-row="${at}"][data-col="${cols.name}"]`);
  if (inp) { inp.focus(); inp.scrollIntoView({ block: 'nearest' }); }
}

function doAddObject() {
  const name = prompt('New object name');
  if (!name || !name.trim()) return;
  if (S.doc.objects.some((o) => o.id === slug(name.trim()))) {
    banner('err', 'An object with that name already exists in this file.');
    return;
  }
  const block = addObject(S.doc, name.trim());
  S.selected = block.id;
  markDirty(); goTo(block.id);
}

/* Update the rail in place. Rebuilding it on every keystroke destroyed the
   button between mousedown and mouseup, eating the next rail click. */
function syncRail() {
  if (!S.doc) return;
  $('rail').querySelectorAll('.rail-row').forEach((wrap) => {
    const o = S.doc.objects.find((x) => x.id === wrap.dataset.id);
    if (!o) return;
    const st = objSigned(o);
    const b = wrap.querySelector('.rail-item');
    b.setAttribute('aria-current', S.selected === o.id ? 'true' : 'false');
    b.querySelector('.nm').textContent = o.name;
    b.querySelector('.ct').textContent = st.total ? `${st.signed}/${st.total}` : '';
  });
}
function markDirty() { S.dirty = true; setStatus(); renderHeadline(); syncRail(); }

/* ===========================================================================
   open / save
   =========================================================================== */
async function openFolder() {
  try {
    S.dir = await fs.pickFolder();
    await loadFolder();
  } catch (e) {
    if (e.name !== 'AbortError') banner('err', 'Could not open folder: ' + esc(e.message), true);
  }
}

async function loadFolder() {
  clearBanners();
  S.files = await fs.listMarkdown(S.dir);
  $('fileName').textContent = S.dir.name;
  $('fileName').title = S.dir.name;
  // Probe each file once so the rail can hide the ones that are not object maps.
  for (const f of S.files) {
    try {
      const t = await fs.read(f.handle);
      const d = parseDocument(t);
      f.objectCount = d.objects.length;
      f.isMap = d.objects.length > 0;
    } catch { f.isMap = false; }
  }
  renderRail();
  const maps = S.files.filter((f) => f.isMap);
  if (!maps.length) {
    const b = banner('warn', 'No object maps in this folder yet. <b>Start one?</b> ', true);
    const go = document.createElement('button');
    go.className = 'btn sm'; go.textContent = 'New map';
    go.onclick = () => { b.remove(); newMap(); };
    b.insertBefore(go, b.querySelector('.x'));
  } else if (maps.length === 1 && !S.file) openFile(maps[0]);
}

/** Create a new object-map file in the open folder and open it. */
async function newMap() {
  if (!S.dir) { banner('warn', 'Open a folder first.'); return; }
  const title = prompt('Name for the new object map', 'Object Map');
  if (!title || !title.trim()) return;
  const clean = title.trim().replace(/\.md$/i, '');
  const filename = clean + '.md';
  try {
    if (!(await ensureWritable(S.dir))) {
      banner('err', '<b>Write permission denied.</b> Chrome needs a grant to create files. Try again and choose <b>Edit files</b>.', true);
      return;
    }
    if (S.files.some((f) => f.name.toLowerCase() === filename.toLowerCase())) {
      banner('err', `<code>${esc(filename)}</code> already exists in this folder.`, true);
      return;
    }
    const handle = await S.dir.getFileHandle(filename, { create: true });
    await fs.write(handle, blankMap(clean));
    await loadFolder();
    const f = S.files.find((x) => x.name === filename);
    if (f) { await openFile(f); goTo(S.doc.objects[0].id); }
    banner('ok', `Created <b>${esc(filename)}</b>. Rename the starter object and start adding rows.`);
  } catch (e) {
    banner('err', `<b>Could not create the file.</b> ${esc(e.name)}: ${esc(e.message)}`, true);
  }
}

async function openFile(f) {
  if (S.dirty && !confirm('Unsaved changes will be lost. Continue?')) return;
  clearBanners();
  const text = await fs.read(f.handle);
  const r = verifyRoundTrip(text);
  S.file = f; S.originalText = text; S.doc = r.doc || parseDocument(text);
  S.dirty = false; S.readOnly = !r.ok;
  S.selected = S.doc.objects.length ? S.doc.objects[0].id : null;
  S.scroll = { map: 0, card: 0, source: 0 };
  $('fileName').textContent = f.name;
  $('fileName').title = f.name;

  if (!r.ok) {
    banner('err', `<b>Read-only.</b> This file did not reproduce byte-for-byte on a test round-trip,
      so it will not be written to. First difference at line <code>${r.line}</code>.<br>
      expected: <code>${esc(String(r.expected).slice(0, 160))}</code><br>
      produced: <code>${esc(String(r.actual).slice(0, 160))}</code>`, true);
  } else if (!S.doc.objects.length) {
    banner('warn', `Parsed, but no objects found — this file does not use the per-object format.`, true);
  }
  syncSegs(); renderRail(); renderStage(); renderHeadline(); setStatus();
}

async function save() {
  if (!S.file || S.readOnly || !S.dirty) return;
  commitActive();
  try {
    if (!(await ensureWritable(S.dir))) {
      banner('err', '<b>Write permission denied.</b> Chrome needs a separate grant to save. Click Save again and choose <b>Edit files</b>.', true);
      return;
    }
    const onDisk = await fs.read(S.file.handle);
    if (onDisk !== S.originalText) {
      if (!confirm('This file changed on disk since you opened it (Obsidian?).\n\nOK = overwrite with your version.\nCancel = discard yours and reload from disk.')) {
        S.dirty = false; await openFile(S.file); return;
      }
    }
    const text = serializeDocument(S.doc);
    await backup(S.file.name, S.originalText);
    await fs.write(S.file.handle, text);

    const sel = S.selected;
    S.originalText = text;
    S.doc = parseDocument(text);
    S.selected = S.doc.objects.some((o) => o.id === sel) ? sel : (S.doc.objects[0] || {}).id;
    S.dirty = false;
    setStatus();
    keepPlace(() => { renderStage(); renderRail(); });
    renderHeadline();
    banner('ok', `Saved <b>${esc(S.file.name)}</b>.`);
  } catch (e) {
    banner('err', `<b>Save failed.</b> ${esc(e.name)}: ${esc(e.message)}`, true);
  }
}

/* ===========================================================================
   chrome wiring
   =========================================================================== */
function syncSegs() {
  // A card is the detail of a Map object and Source is a check on the Map, so
  // both keep Map lit rather than leaving no view selected.
  // The rail is the only way to move between objects in Card and Graph. On the
  // Map it would be a second copy of what the cards already show, so it steps
  // aside. This lives here because syncSegs runs on every view change.
  const railEl = $('rail');
  if (railEl) railEl.hidden = (S.view === 'map');

  const lit = (S.view === 'card' || S.view === 'source') ? 'map' : S.view;
  document.querySelectorAll('#viewSeg button').forEach((b) =>
    b.setAttribute('aria-pressed', b.dataset.view === lit ? 'true' : 'false'));
  $('modeBtn').setAttribute('aria-pressed', S.mode === 'confidence' ? 'true' : 'false');
  document.body.dataset.mode = S.mode;
  document.body.dataset.present = S.present ? 'true' : 'false';
}

$('fileName').onclick = openFolder;
$('saveBtn').onclick = save;
$('presentBtn').onclick = () => { S.present = true; S.view = 'card'; syncSegs(); renderStage(); };
$('exitPresent').onclick = () => { S.present = false; syncSegs(); renderStage(); };
document.querySelectorAll('#viewSeg button').forEach((b) => (b.onclick = () => {
  S.scroll[S.view] = $('stage').scrollTop;
  S.view = b.dataset.view;
  syncSegs(); renderStage();
  $('stage').scrollTop = S.scroll[S.view] || 0;
}));
$('modeBtn').onclick = () => { S.mode = S.mode === 'confidence' ? 'normal' : 'confidence'; syncSegs(); };

/* Enter commits a cell instead of inserting a newline into a table row. */
$('stage').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.matches && e.target.matches('textarea.cell')) {
    e.preventDefault(); e.target.blur();
  }
});
/* Alt+Arrow is the fluent reorder path; the global handler ignores altKey. */
$('stage').addEventListener('keydown', (e) => {
  if (!e.altKey || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  if (S.readOnly || S.view !== 'card') return;
  const tr = e.target.closest && e.target.closest('tr[data-idx]');
  if (!tr) return;
  e.preventDefault();
  const obj = S.doc.objects.find((o) => o.id === S.selected);
  if (obj && obj.table) doMove(obj, +tr.dataset.idx, e.key === 'ArrowUp' ? -1 : 1);
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); commitActive(); save(); return; }
  if (e.key === 'Escape' && S.present) { S.present = false; syncSegs(); renderStage(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.target.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!S.doc || !S.doc.objects.length) return;
  // Source is a check on what will be written, not a peer of the two real views.
  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    S.view = S.view === 'source' ? 'map' : 'source';
    syncSegs(); renderStage(); renderRail();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    const cur = S.doc.objects.findIndex((o) => o.id === S.selected);
    const at = cur < 0 ? 0 : cur + (e.key === 'ArrowRight' ? 1 : -1);
    if (at >= 0 && at < S.doc.objects.length) goTo(S.doc.objects[at].id);
  }
});
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* boot ---------------------------------------------------------------------*/
(async function boot() {
  syncSegs(); renderStage(); setStatus();
  if (typeof window.showDirectoryPicker !== 'function') {
    banner('err', `<b>This browser cannot open local folders.</b> Use Chrome, Edge, Arc or Brave.`, true);
    $('fileName').disabled = true; return;
  }
  if (location.protocol === 'file:') {
    banner('err', `<b>Opened as a file, not over http.</b> Run <code>./serve.sh</code> and open
      <code>http://localhost:8042</code>.`, true);
    return;
  }
  try {
    const restored = await fs.restoreFolder();
    if (restored && restored.needsGrant) {
      banner('warn', 'A folder is remembered from last time. Click <b>Open folder</b> to reconnect it — browsers require a click.', true);
    } else if (restored) { S.dir = restored; await loadFolder(); }
  } catch (e) { /* first run or stale handle */ }
})();
</script>
</body>
</html>
