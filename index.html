<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>object map</title>
<!-- Family mark: rounded-square badge, shared across ORCA/jobmap/priority-guide.
     Color is this app's own --accent blue; glyph is a small connected node
     graph — objects and the relationships between them, the thing ORCA models. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='rgb(208,52,44)'/><path d='M16 9L9 22M16 9L23 22M9 22L23 22' stroke='white' stroke-width='2' stroke-linecap='round'/><circle cx='16' cy='9' r='3' fill='white'/><circle cx='9' cy='22' r='3' fill='white'/><circle cx='23' cy='22' r='3' fill='white'/></svg>">
<style>
:root {
  /* Palette reconciled from shared/tokens.css (design-utilities repo) — the
     source of truth for ORCA/jobmap/priority-guide. This is a manually-synced
     copy, not an @import (none of the three apps takes on a build step); see
     that file's README for how to re-check this block for drift. */
  --bg: #f6f7f9; --panel: #fff; --ink: #16181d; --dim: #6b7280; --faint: #9aa1ac;
  --line: rgba(16,18,22,.11); --line-2: rgba(16,18,22,.2);
  --btn-face: transparent; --btn-face-hover: rgba(16,18,22,.055); --btn-line: transparent;
  /* Two steps of hover for an editable field: the row-level tint that shows you
     WHICH cells are fields, and the stronger cell-level one under the pointer. */
  --field-hover: rgba(16,18,22,.04); --field-edge: rgba(16,18,22,.14);
  --scrim: rgba(16,18,22,.34);
  --accent: #2563eb; --accent-soft: rgba(37,99,235,.10); --on-accent: #fff;
  --warn: #9a6700; --warn-soft: rgba(154,103,0,.11);
  --danger: #d0342c; --danger-soft: rgba(208,52,44,.09);
  --ok: #177245; --ok-soft: rgba(23,114,69,.11); --on-ok: #fff;
  --flag: #b8541f; --act: #b3261e; --none: #8a8f98;
  /* One fixed colour per section, used at dot size only — never behind data.
     ORCA-specific, not part of the shared token set. */
  --oc-core: #2563a8; --oc-meta: #a3387f; --oc-rel: #96680f; --oc-cta: #17724a;
  --t-micro: 11px; --t-small: 12.5px; --t-body: 13.5px; --t-ui: 14px; --t-title: 16px;
  --t-lede: 17px; --t-display: 28px; --t-hero: 38px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 28px; --s7: 96px;
  --ctrl-h: 28px; --ctrl-h-sm: 24px; --row-pad-y: 4px;
  --radius: 10px; --radius-sm: 7px; --ease: cubic-bezier(.22,.61,.36,1);
  --shadow-sm: 0 1px 2px rgba(16,18,22,.04), 0 14px 34px -22px rgba(16,18,22,.30);
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #16171a; --panel: #1f2024; --ink: #f5f5f7; --dim: #98989d; --faint: #7c7c84;
    --line: rgba(255,255,255,.13); --line-2: rgba(255,255,255,.2);
    --btn-face: transparent; --btn-face-hover: rgba(255,255,255,.09); --btn-line: transparent;
    --field-hover: rgba(255,255,255,.055); --field-edge: rgba(255,255,255,.18);
    --scrim: rgba(0,0,0,.55);
    --accent: #0a84ff; --accent-soft: rgba(10,132,255,.16); --on-accent: #fff;
    --warn: #e0b25a; --warn-soft: rgba(224,178,90,.13);
    --danger: #ff453a; --danger-soft: rgba(255,69,58,.14);
    --ok: #30d158; --ok-soft: rgba(48,209,88,.14); --on-ok: #0e1a14;
    --flag: #ff9c52; --act: #ff6b5c; --none: #969ba6;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3), 0 14px 34px -22px rgba(0,0,0,.6);
    --oc-core: #64a9ff; --oc-meta: #f284cd; --oc-rel: #e3ae4c; --oc-cta: #45cf90;
  }
}
* { box-sizing: border-box; }
/* `.btn`/`.seg` set their own `display`, which otherwise outranks the
   browser's default `[hidden]` rule at equal specificity. */
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: var(--t-ui)/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; }

/* controls: one fill, one border, one hover step, one focus ring ----------- */
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell:focus-visible { outline-offset: -2px; }
.btn { background: var(--btn-face); border: 1px solid var(--btn-line); border-radius: 8px;
  height: var(--ctrl-h); padding: 0 11px; font-size: var(--t-small); font-weight: 500;
  color: var(--dim); display: inline-flex; align-items: center; gap: 6px;
  transition: background 140ms cubic-bezier(.22,.61,.36,1), color 140ms cubic-bezier(.22,.61,.36,1); }
.btn:hover { color: var(--ink); }
.btn:hover { background: var(--btn-face-hover); }
.btn:disabled { cursor: default; color: var(--faint); }
.btn.sm { height: var(--ctrl-h-sm); padding: 0 8px; font-size: var(--t-small); }
.btn.add { height: 22px; padding: 0 8px; font-size: var(--t-small); font-weight: 500;
  color: var(--accent); border-radius: 6px; }
.btn.add:hover { color: var(--accent); background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { background: var(--btn-face); border-color: var(--btn-line); color: var(--faint); opacity: 1; }
.btn[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.linkbtn { border: 0; background: none; padding: 0; font-size: var(--t-small); color: var(--faint); }
.linkbtn:hover { color: var(--danger); text-decoration: underline; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--btn-face-hover);
  border: 0; border-radius: 9px; }
.seg button { height: var(--ctrl-h-sm); padding: 0 12px; border: 0; border-radius: 7px;
  background: none; color: var(--dim); font-size: var(--t-small); font-weight: 500; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed=true] { background: var(--panel); color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* header: fixed geometry so it can never change height --------------------- */
header { display: flex; align-items: center; gap: var(--s3); flex-wrap: nowrap;
  min-height: 44px; padding: 8px var(--s4); background: var(--panel); border-bottom: 1px solid var(--line); }
/* Brand + folder picker: shared literally, not just in spirit, with jobmap and
   priority-guide — same weight/tracking on the name, same icon+label shape on
   the picker, so the three read as one family of tools rather than three
   one-off apps that happen to sit next to each other. */
.brand { font-weight: 600; letter-spacing: -.01em; color: var(--ink); white-space: nowrap; }
.file { color: var(--dim); white-space: nowrap; max-width: 28ch; cursor: pointer;
  padding: 4px 8px; border-radius: 7px; display: flex; align-items: center; gap: 6px;
  margin-left: -8px; border: 0; background: none; font: inherit; }
.file span { overflow: hidden; text-overflow: ellipsis; }
.file svg { color: var(--faint); flex: none; }
.file:hover svg { color: var(--ink); }
.file:hover { background: var(--btn-face-hover); color: var(--ink); }
.file:disabled { cursor: not-allowed; opacity: .5; }
.file:disabled:hover { background: none; color: var(--dim); }
.file:disabled:hover svg { color: var(--faint); }
.status { flex: none; width: 118px; font-size: var(--t-small); color: var(--dim); }
.status.dirty { color: var(--warn); font-weight: 600; }
.spacer { flex: 1; }
.headline { display: inline-flex; align-items: center; gap: var(--s2); flex: none;
  font-size: var(--t-small); color: var(--dim); font-variant-numeric: tabular-nums; }
.headline b { color: var(--ok); font-weight: 600; }
.headline .sigbar { width: 56px; }

/* banners stay in flow; transient toasts never push the page --------------- */
.banner { padding: 10px var(--s4); font-size: var(--t-body); border-bottom: 1px solid var(--line); position: relative; }
.banner.err { background: var(--danger-soft); color: var(--danger); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner code { font-family: var(--mono); font-size: var(--t-small); }
.banner .x { position: absolute; right: 10px; top: 7px; border: 0; background: none; color: inherit; opacity: .6; }
#toasts { position: fixed; right: var(--s4); bottom: var(--s4); z-index: 40;
  width: min(400px, calc(100vw - 32px)); display: flex; flex-direction: column-reverse;
  gap: var(--s2); pointer-events: none; }
#toasts .banner { pointer-events: auto; border: 1px solid var(--line); border-radius: var(--radius); }

/* layout ------------------------------------------------------------------ */
main { flex: 1; display: flex; min-height: 0; }
#rail { width: 232px; flex: none; border-right: 1px solid var(--line); background: var(--panel);
  overflow-y: auto; padding: 10px; }
#stage { flex: 1; overflow-y: auto; padding: 0 26px var(--s7); }
.rail-h { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
  margin: var(--s3) 6px 5px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
.rail-row { display: flex; align-items: center; }
.rail-row .rail-item { flex: 1; min-width: 0; }
.rail-tools { display: flex; flex-direction: column; flex: none; }
.rail-item { display: flex; align-items: center; gap: var(--s2); width: 100%; text-align: left;
  background: none; border: 0; border-radius: 6px; padding: 5px 7px; font-size: var(--t-body); }
.rail-item:hover { background: var(--btn-face-hover); }
.rail-item[aria-current=true] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.rail-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-item .ct { font-size: var(--t-micro); color: var(--faint); font-variant-numeric: tabular-nums; }
.rail-item.muted .nm { color: var(--faint); }

.sigbar { display: flex; height: 3px; overflow: hidden; background: var(--line); }
.sigbar i { display: block; height: 100%; background: var(--ok); }

/* map --------------------------------------------------------------------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--s3); padding-top: var(--s5); }
.mini { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--s3); text-align: left; width: 100%; }
.mini:hover { background: var(--btn-face-hover); border-color: var(--line-2); }
.mini h4 { margin: 0 0 var(--s1); font-size: var(--t-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .def { font-size: var(--t-small); color: var(--dim); margin: 0 0 10px; min-height: 2.6em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini .counts span { white-space: nowrap; }
.mini .counts { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); margin-top: var(--s2); font-size: var(--t-micro);
  color: var(--faint); font-variant-numeric: tabular-nums; }

/* A map above ~40 objects reads as overwhelming in cards, so List trades the
   card panel for one line per object — same data (including the progress
   bar), denser layout.
   Each row is its own independent grid (so the row stays one clickable
   button), which means "auto"-sized columns would size to THAT row's own
   content — a long counts string on one row and a short one on the next
   throws off the name/definition columns between them. Fixed widths on the
   variable-length columns (counts, tail) are what keep every row's name and
   definition lining up in one scannable rail down the page. */
.mapnav { position: sticky; top: 0; z-index: 4; display: flex; align-items: center;
  justify-content: space-between; padding: var(--s4) 0 var(--s3); background: var(--bg); }
.mapnav .ct { font-size: var(--t-small); color: var(--faint); font-variant-numeric: tabular-nums; }
.list-rows { display: flex; flex-direction: column; }
.row-item { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(160px, 2fr) 230px 130px;
  align-items: center; gap: var(--s4); width: 100%; text-align: left; background: none;
  border: 0; border-top: 1px solid var(--line); padding: 8px 6px; border-radius: 6px; }
.row-item:first-child { border-top: 0; }
.row-item:hover { background: var(--btn-face-hover); }
.row-item h4 { margin: 0; font-size: var(--t-body); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-item .def { margin: 0; font-size: var(--t-small); color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-item .counts { display: flex; gap: var(--s2); font-size: var(--t-micro); color: var(--faint);
  font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-item .tail { display: flex; align-items: center; justify-content: flex-end; gap: var(--s2); }
.row-item .tail .prog { font-size: var(--t-small); color: var(--dim); font-variant-numeric: tabular-nums;
  white-space: nowrap; min-width: 3.4em; text-align: right; }
.row-item .tail .sigbar { width: 64px; flex: none; }

/* card: no panel, no boxes — five section rules and one header row --------- */
.card { background: none; border: 0; border-radius: 0; padding: 0; max-width: 1180px; }
.cardnav { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px;
  height: 40px; background: var(--bg); border-bottom: 1px solid var(--line);
  margin: 0 -26px 20px; padding: 0 26px; }
.cardnav .navbtn { width: 26px; height: 26px; padding: 0; justify-content: center; }
.cardnav .pos { font-size: var(--t-small); color: var(--faint); font-variant-numeric: tabular-nums; }
.cardnav .prog { font-size: var(--t-small); color: var(--dim); font-variant-numeric: tabular-nums; }
.cardnav .sigbar { width: 64px; flex: none; }
.cardnav .navname { font-size: var(--t-body); font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30ch; }

/* The object header. Name, then definition, then nothing else — the two
   questions you arrive with, answered before anything asks you to read a table. */
.objhead { padding: 4px 0 0; margin-bottom: var(--s5); }
#nameIn { display: block; font-size: var(--t-display); font-weight: 650; letter-spacing: -.022em;
  line-height: 1.15; border: 1px solid transparent; background: none; color: var(--ink);
  border-radius: 8px; padding: 2px 7px; margin: 0 -7px var(--s2); font-family: inherit;
  field-sizing: content; min-width: 6ch; max-width: 26ch; width: auto; }
#nameIn:hover { border-color: var(--line); }
#nameIn:focus { border-color: var(--accent); background: var(--panel); outline: none; }
#defEdit { font-size: var(--t-lede); line-height: 1.5; letter-spacing: -.005em;
  color: var(--ink); max-width: 68ch; field-sizing: content; min-height: 1.5em; }
#defEdit::placeholder { color: var(--faint); font-style: italic; }

.sec { margin-top: var(--s6); padding-top: 14px; border-top: 1px solid var(--line); }
.sec:first-of-type { margin-top: 20px; padding-top: 0; border-top: 0; }
.sec-h { display: flex; align-items: center; gap: var(--s2); margin: 0 0 var(--s2);
  font-size: var(--t-micro); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.sec .sec-h { position: sticky; top: 40px; z-index: 2; background: var(--bg); padding: 5px 0; }
.sec-h .ct { color: var(--faint); font-weight: 400; letter-spacing: 0; }
tr, .sec, .grp { scroll-margin-top: 84px; }

/* --- the ORCA groups ------------------------------------------------------
   R, C and A get one tier; the kinds inside a group get a quieter one. Before
   this, core content, metadata, actions and nested objects were four headings
   of identical weight, which said they were four peer ideas. They are not:
   metadata is a KIND OF ATTRIBUTE, and the card should say so without
   anybody having to be told. */
.grp { margin-top: 46px; }
.grp:first-of-type { margin-top: 0; }
.grp-h { position: sticky; top: 40px; z-index: 3; display: flex; align-items: baseline;
  gap: var(--s2); padding: 7px 0 7px; margin-bottom: var(--s3); background: var(--bg);
  border-bottom: 1px solid var(--line-2); }
.grp-h .dot, .sub-h .dot { align-self: center; }
.grp-h .btn.add, .sub-h .btn.add { margin-left: auto; align-self: center; }
.grp-t { font-size: var(--t-body); font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink); }
.grp-n { font-size: var(--t-small); color: var(--faint); font-variant-numeric: tabular-nums; }
.grp .sub { margin-top: var(--s5); }
.grp .sub:first-of-type { margin-top: 0; }
.sub-h { display: flex; align-items: center; gap: var(--s2); margin: 0 0 var(--s2); }
.sub-t { font-size: var(--t-ui); font-weight: 600; color: var(--ink); letter-spacing: -.005em; }
.sub-n { font-size: var(--t-small); color: var(--faint); font-variant-numeric: tabular-nums; }
.blurb { font-size: var(--t-small); color: var(--faint); font-weight: 400;
  letter-spacing: 0; text-transform: none; }
.grp-h .blurb { padding-left: var(--s1); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dim); }
.dot.core { background: var(--oc-core); }
.dot.meta { background: var(--oc-meta); }
.dot.nested { background: var(--oc-rel); }
.dot.action { background: var(--oc-cta); }
.empty-sec { font-size: var(--t-small); color: var(--faint); padding: 2px 0 var(--s3) 16px;
  font-style: italic; }

.ta { width: 100%; border: 1px solid transparent; background: none; border-radius: 6px;
  padding: 6px 8px; margin: 0 -8px; font: inherit; color: inherit; resize: none; }
.ta:hover { border-color: var(--line); }
#notesEdit { font-size: var(--t-body); max-width: 74ch; field-sizing: content; min-height: 2.4em; max-height: 12em; }

table.rows { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.rows th { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .06em;
  color: var(--faint); text-align: left; font-weight: 600; padding: 0 6px 5px; white-space: nowrap; }
table.rows td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: top; position: relative; }
table.rows tbody tr:first-child td { border-top: 0; }
table.rows td.g-move, table.rows td.g-del, table.rows td.g-sign { padding-left: 0; padding-right: 0; }
/* Hovering a row lights up each editable field SEPARATELY — the gaps between
   them are what make three fields read as three fields and not one strip.
   A fill AND an edge, because most cells on a real map are empty and a tint on
   nothing is invisible: the edge is what shows you where a field starts and
   stops before you have committed to clicking. */
table.rows tbody tr:hover .cell:not(:disabled),
table.rows tbody tr:focus-within .cell:not(:disabled) {
  background-color: var(--field-hover); border-color: var(--field-edge); }
td.g-move, td.g-del, td.g-sign { padding-top: 5px; }
td.g-sign { text-align: center; }
td.c-name { display: flex; align-items: flex-start; gap: 6px; flex-wrap: nowrap; }
td.c-name .cell { flex: 1 1 auto; min-width: 0; }

.cell { width: 100%; border: 1px solid transparent; background: none; border-radius: 5px;
  padding: var(--row-pad-y) 6px; font: inherit; font-size: var(--t-body); color: inherit; }
.cell:hover:not(:disabled) { background-color: var(--btn-face-hover); border-color: var(--line-2); }
.cell:focus { background-color: var(--panel); border-color: var(--accent); outline: none; }
.cell:disabled { opacity: 1; color: var(--dim); -webkit-text-fill-color: var(--dim); cursor: default; }
textarea.cell { resize: none; overflow-y: auto; line-height: 1.45; }
@supports (field-sizing: content) {
  textarea.cell { field-sizing: content; }
  /* Notes are NOT capped. A note that scrolls inside a three-line box is a note
     nobody reads — and a note is where the reason for a row lives, so it is the
     part most worth reading. Long rows are the acceptable cost; the alternative
     is hiding the content the map exists to carry. Names stay capped because a
     name that runs past two lines is a name that wants to be a note. */
  textarea.cell.nm { max-height: 2.7em; }
}
/* Example values are DATA, not prose — a real value lifted from the live system.
   Monospace is the point rather than decoration: it is what lets you count the
   digits in an account number and see at a glance whether codes are sequential
   or random. Muted so a populated example never outweighs the name beside it. */
textarea.cell.example { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: var(--t-small); color: var(--dim); }
textarea.cell.example::placeholder { color: var(--line-2); }
select.cell { appearance: none; width: 100%; text-overflow: ellipsis; color: var(--dim);
  padding-right: 17px; background-repeat: no-repeat; background-size: 4px 4px, 4px 4px;
  background-position: calc(100% - 10px) calc(50% + 1px), calc(100% - 6px) calc(50% + 1px);
  background-image: linear-gradient(45deg, transparent 50%, var(--faint) 50%),
                    linear-gradient(135deg, var(--faint) 50%, transparent 50%); }
/* A cardinality nobody has been asked for reads as unanswered, not as absent. */
select.cell.unset { color: var(--faint); }
select.cell:disabled { background-image: none; }
.qualchip { font-size: var(--t-micro); color: var(--dim); padding: 1px 6px; margin-top: 2px;
  border-left: 2px solid var(--line-2); }

/* row state lives in 2px of left edge, never in the row background -------- */
tr.rowdirty td:first-child::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px;
  width: 2px; border-radius: 1px; background: var(--warn); }
tr.signed .cell { color: var(--dim); }
/* An unsigned sign-off was a 20px square of nothing: transparent fill,
   transparent border, transparent tick. "How much have we signed off on?" is
   the headline question this tool exists to answer, and you cannot answer it
   against a column you cannot see. It is an empty checkbox now. */
.lockbtn { width: 18px; height: 18px; padding: 0; border: 1.5px solid var(--line-2);
  background: var(--panel); border-radius: 4px; color: transparent; font-size: 10px;
  line-height: 1; display: inline-flex; align-items: center; justify-content: center;
  transition: border-color 120ms, color 120ms, background-color 120ms; }
.lockbtn:hover:not(:disabled) { border-color: var(--ok); color: var(--ok);
  background: var(--ok-soft); }
.lockbtn.on, .lockbtn.on:hover { background: var(--ok); border-color: var(--ok);
  color: var(--on-ok); }
.lockbtn:disabled { opacity: 1; cursor: default; }
.movebtn { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 14px;
  padding: 0; border: 0; background: none; color: var(--faint); border-radius: 3px; }
.movebtn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.rowbtn { display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: none; color: var(--faint); padding: 2px 5px; border-radius: 4px; }
.rowbtn:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }
.movebtn, .rowbtn { opacity: 0; transition: opacity 90ms; }
tr:hover .movebtn, tr:hover .rowbtn, tr:focus-within .movebtn, tr:focus-within .rowbtn,
.rail-row:hover .movebtn, .rail-row:focus-within .movebtn,
.movebtn:focus-visible, .rowbtn:focus-visible { opacity: 1; }
tr:hover .movebtn:disabled, tr:focus-within .movebtn:disabled,
.rail-row:hover .movebtn:disabled { opacity: .25; cursor: default; }
tr.justmoved td { animation: settle .5s ease-out; }
@keyframes settle { from { background: var(--accent-soft); } to { background: transparent; } }

}

.chips { display: flex; gap: var(--s1); margin: 0; padding-top: 3px; flex-wrap: wrap; align-items: center; }

.chip { display: inline-flex; align-items: center; gap: 1px; font-size: var(--t-micro);
  border-radius: 999px; padding: 1px 2px 1px 8px; border: 1px solid var(--accent);
  color: var(--accent); background: none; white-space: nowrap; }
/* An object defined in ANOTHER file. Grey and dashed read as broken — as a row
   someone failed to finish — when it is in fact deliberate: this file is one
   area of a larger map. Solid, filled and labelled says "elsewhere", not "missing". */
.chip.ghost { border-color: var(--warn); color: var(--warn); border-style: dashed;
  background: var(--warn-soft); }
.chip.ghost .tlbl { cursor: pointer; }
.chip.ghost .tlbl:hover { text-decoration: underline; }
.chip .ext { font-size: 9px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--warn); padding: 0 2px 0 5px; }
.chip .tlbl { border: 0; background: none; color: inherit; padding: 0; font-size: inherit; }
.chip .tlbl:hover { text-decoration: underline; }
.chipx { display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: none; color: inherit; padding: 0 4px; border-radius: 999px; opacity: 0; }
tr:hover .chipx, tr:focus-within .chipx, .chipx:focus-visible { opacity: .6; }
.chipx:hover { opacity: 1; background: var(--danger-soft); color: var(--danger); }
.addtarget { width: 20px; height: 18px; padding: 0; border: 1px dashed var(--btn-line);

  display: inline-flex; align-items: center; justify-content: center; }
.addtarget:hover { background: var(--accent-soft); color: var(--accent);
  border-color: var(--accent); border-style: solid; }
.tgtinput { font-size: var(--t-micro); border: 1px solid var(--accent); border-radius: 999px;
  padding: 1px 8px; background: var(--bg); color: var(--ink); width: 16ch; font-family: inherit; }
.lbltext { font-size: var(--t-micro); color: var(--dim); }

/* A note is a SENTENCE with a word in front of it, the way it reads in the
   markdown — *Open:* … — not a titled field. The label used to sit in its own
   96px uppercase column, which made naming the note look like step one of
   writing it. It is now an inline word you can change and mostly won't. */
.notes { border-left: 2px solid var(--line-2); padding-left: var(--s3); margin: 0; }
.notes .nrow { display: flex; align-items: baseline; gap: 0; margin-bottom: 6px; }
.notes .nlbl { flex: none; width: auto; min-width: 2ch; max-width: 20ch;
  font-size: var(--t-body); font-weight: 600; color: var(--ink); font-family: inherit;
  background: none; border: 1px solid transparent; border-radius: 5px; padding: 2px 0 2px 4px; }
@supports (field-sizing: content) { .notes .nlbl { field-sizing: content; } }
.notes .nlbl:hover { border-color: var(--line); }
.notes .nlbl:focus { border-color: var(--accent); background: var(--panel); outline: none; }
.notes .ncolon { flex: none; font-size: var(--t-body); font-weight: 600; color: var(--ink);
  margin-left: -1px; margin-right: 7px; }
.notes .ndel { opacity: 0; flex: none; margin-left: var(--s2); }
.notes .nrow:hover .ndel, .notes .nrow:focus-within .ndel { opacity: .6; }
.notes .nrow:last-child { margin-bottom: 0; }
.notes .nbody { flex: 1; min-width: 0; font-size: var(--t-body); line-height: 1.5;
  field-sizing: content; padding: 2px 6px; margin: 0; }
.notes .nbody::placeholder { color: var(--faint); }
.notes .lbl { padding-top: 3px; }

/* Referenced by IS a table, so it is laid out as one: three columns that line
   up down the page, and a note that wraps. Clipping the note to one nowrap line
   hid the only thing the section is for — WHY the other object points here. */
.backlinks { display: grid; grid-template-columns: minmax(7rem, max-content) max-content 1fr;
  gap: 0 var(--s4); align-items: baseline; }
.backlinks .bh { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .06em;
  color: var(--dim); font-weight: 600; padding-bottom: 5px; }
.backlinks .bc { padding: 7px 0; border-top: 1px solid var(--line); min-width: 0; }
.backlinks .bc.from button { border: 0; background: none; color: var(--accent); padding: 0;
  font-weight: 600; font-size: var(--t-body); text-align: left; }
.backlinks .bc.from button:hover { text-decoration: underline; }
.backlinks .bc.card { font-size: var(--t-small); color: var(--dim); white-space: nowrap;
  font-variant-numeric: tabular-nums; }
.backlinks .bc.note { font-size: var(--t-small); color: var(--dim); line-height: 1.5; }
.backlinks .bc.blank { color: var(--faint); }
.empty-note { color: var(--dim); font-size: var(--t-body); }

/* One dialog, inside the app. The browser's own is captioned "localhost:8042
   says", which reads as a page ORCA does not control — and it cannot carry a
   third choice, or a verb on its buttons instead of OK and Cancel. */
.scrim { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center;
  justify-content: center; padding: var(--s4); background: var(--scrim);
  animation: scrimin 110ms ease-out; }
@keyframes scrimin { from { opacity: 0 } to { opacity: 1 } }
.dlg { width: min(430px, 100%); background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: var(--s5);

@keyframes dlgin { from { opacity: 0; transform: translateY(6px) scale(.985) } to { opacity: 1 } }
.dlg h2 { margin: 0 0 var(--s2); font-size: var(--t-title); font-weight: 600; letter-spacing: -.01em; }
.dlg p { margin: 0 0 var(--s3); font-size: var(--t-body); color: var(--dim); line-height: 1.55; }
.dlg p:last-of-type { margin-bottom: var(--s4); }
.dlg p b { color: var(--ink); font-weight: 600; }
.dlg .dlgin { width: 100%; height: 32px; margin-bottom: var(--s4); padding: 0 9px;
  font: inherit; font-size: var(--t-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line-2); border-radius: 7px; }
.dlg .dlgin:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.dlg .acts { display: flex; justify-content: flex-end; gap: var(--s2); }
.dlg .acts .btn { height: 30px; }
.dlg .acts .btn.plain { border-color: var(--line); color: var(--dim); }
.dlg .acts .btn.plain:hover { color: var(--ink); }
.dlg .acts .btn.danger { background: var(--danger); border-color: var(--danger);
  color: #fff; font-weight: 500; }

@media (prefers-reduced-motion: reduce) { .scrim, .dlg { animation: none } }
#capScrim { display: none; }

  margin-top: 32px; padding-top: var(--s4); }
.cardfoot .sec-h { position: static; }

/* graph ------------------------------------------------------------------- */
.gbar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: var(--s2);
  height: 40px; background: var(--bg); border-bottom: 1px solid var(--line);
  margin: 0 -26px var(--s3); padding: 0 26px; }
.gbar select { height: var(--ctrl-h-sm); font: inherit; font-size: var(--t-small); color: var(--ink);
  background: var(--btn-face); border: 1px solid var(--btn-line); border-radius: 6px; padding: 0 6px; }
.gbar .note { font-size: var(--t-small); color: var(--dim); font-variant-numeric: tabular-nums; }
.gwrap { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
svg.graph { display: block; width: 100%; height: 62vh; cursor: grab; touch-action: none; }

/* ---------------------------------------------------------------------------
   The graph is ONE framed instrument: canvas, then a plain-English readout of
   whatever is under the cursor, then a key whose items highlight what they
   describe. A caption stuck underneath a diagram explains nothing; a sentence
   that appears when you point at a thing explains everything.
   --------------------------------------------------------------------------- */
.gframe { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
  overflow: hidden; }
.gbody { overflow: auto; max-height: 70vh; }
.greadout { display: flex; align-items: center; gap: var(--s2); min-height: 34px;
  padding: 6px var(--s3); border-top: 1px solid var(--line); background: var(--bg);
  font-size: var(--t-body); color: var(--ink); }
.greadout .hint { color: var(--dim); }

.greadout .tag { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .06em;
  border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line-2); color: var(--dim); }
.greadout .tag.signed { border-color: var(--ok); color: var(--ok); }
.greadout .tag.contested { border-color: var(--warn); color: var(--warn); }
.greadout .tag.open { border-color: var(--line-2); color: var(--faint); }
.gkey { display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--s1);
  padding: 6px var(--s3) 8px; border-top: 1px solid var(--line); background: var(--panel); }
.gkey .grp { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .06em;
  color: var(--faint); margin: 0 var(--s2) 0 0; }
.gkey .grp + .grp, .gkey .ki + .grp { margin-left: var(--s4); }
.ki { display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent;
  background: none; border-radius: 999px; padding: 2px 8px; font-size: var(--t-small);
  color: var(--dim); }
.ki:hover, .ki:focus-visible { background: var(--btn-face-hover); color: var(--ink); }
.ki svg { vertical-align: middle; }
.ki svg line { stroke: var(--line-2); stroke-width: 1.25; }
.ki svg line.sgn { stroke: var(--ok); stroke-width: 1.75; }
.ki svg line.ctd { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 5 3; }
.ki svg circle.openswatch { fill: var(--panel); stroke: var(--line-2); stroke-width: 1.25; }
.ki .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px;
  border: 1px solid var(--line-2); }
.ki .sw.signed { background: var(--ok-soft); border-color: var(--ok); }
.ki .sw.contested { background: var(--warn-soft); border-color: var(--warn); }
.ki .sw.inv { position: relative; background: var(--panel); }
.ki .sw.inv::after { content: ''; position: absolute; inset: 0; margin: auto; width: 4px; height: 4px;
  border-radius: 50%; border: 1px solid var(--line-2); }
.ki .tok { font-weight: 700; color: var(--ink); min-width: 12px; text-align: center; }

/* pointing at a key item dims everything it does not describe */
.gframe[data-hl] td.mx, .gframe[data-hl] td.inverse,
.gframe[data-hl] .eg, .gframe[data-hl] .gl, .gframe[data-hl] .nd { opacity: .16; }
.gframe[data-hl=signed] td.mx.signed, .gframe[data-hl=signed] .eg.signed { opacity: 1; }
.gframe[data-hl=contested] td.mx.contested, .gframe[data-hl=contested] .eg.contested { opacity: 1; }
.gframe[data-hl=inverse] td.inverse { opacity: 1; }
.gframe[data-hl=ghost] .nd.ghost { opacity: 1; }
.gframe[data-hl=open] .gl.open { opacity: 1; }
.gframe[data-hl=one] .gl.one { opacity: 1; }
.gframe[data-hl=many] .gl.many { opacity: 1; }
.gframe[data-hl=stated] td.mx:not(.signed):not(.contested),
.gframe[data-hl=stated] .eg:not(.signed):not(.contested) { opacity: 1; }

/* grid: a real matrix — one shared rule between cells, sticky headers, and a
   crosshair so a row can be tracked across sixteen columns. ---------------- */
table.gmx { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 0 auto; }
table.gmx th, table.gmx td { border: 0; }
table.gmx thead th { position: sticky; top: 0; z-index: 2; background: var(--panel);
  vertical-align: bottom; padding: 0; }
table.gmx th.corner { left: 0; z-index: 4; background: var(--panel); }
table.gmx th.vh { width: 30px; height: 156px; }
table.gmx th.vh span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: var(--t-micro); font-weight: 600; color: var(--dim); padding: 8px 0 6px;
  max-height: 148px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.gmx th.vh.ghost span { color: var(--faint); font-weight: 400; }
table.gmx th.rh { position: sticky; left: 0; z-index: 3; background: var(--panel);
  text-align: left; font-weight: 400; padding: 0;
  border-right: 1px solid var(--line-2); }
table.gmx th.rh button { border: 0; background: none; color: var(--ink); font: inherit;
  font-size: var(--t-body); padding: 0 var(--s3) 0 10px; height: 30px; width: 100%;
  max-width: 210px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.gmx th.rh button:hover { color: var(--accent); }
table.gmx thead th.vh { border-bottom: 1px solid var(--line-2); }
table.gmx td { width: 30px; height: 30px; text-align: center; font-size: var(--t-small);
  color: var(--faint); box-shadow: inset -1px -1px 0 var(--line); }
table.gmx td.mx { color: var(--accent); font-weight: 700; background: var(--accent-soft); }
table.gmx td.mx.signed { background: var(--ok-soft); color: var(--ok); }
table.gmx td.mx.contested { background: var(--warn-soft); color: var(--warn); }
table.gmx td.self { background: var(--bg); }
table.gmx td.inverse::after { content: ''; display: block; width: 5px; height: 5px; margin: 0 auto;
  border-radius: 50%; border: 1px solid var(--line-2); }
/* crosshair, driven by data attributes set on hover */
table.gmx[data-r] tbody tr[data-row] { background: none; }
table.gmx tbody tr.xrow { background: color-mix(in srgb, var(--btn-face) 46%, transparent); }
table.gmx tbody tr.xrow th.rh { background: var(--btn-face); }
table.gmx col.xcol { background: color-mix(in srgb, var(--btn-face) 46%, transparent); }
table.gmx thead th.xhead span { color: var(--ink); }
table.gmx td.xcell { outline: 2px solid var(--accent); outline-offset: -2px; }

pre.source { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--s4) 18px; overflow-x: auto; font-family: var(--mono); font-size: var(--t-small);
  line-height: 1.65; margin: 0; }
pre.source .ln { color: var(--faint); user-select: none; display: inline-block; width: 3.2em; }
pre.source mark { background: var(--accent-soft); color: inherit; }

/* "what have we signed off on?" — dim, do not erase ----------------------- */
body[data-mode=confidence] tr:not(.signed) { opacity: .45; }
body[data-mode=confidence] tr:not(.signed):hover { opacity: 1; }
body[data-mode=confidence] tr:not(.signed) :is(.lockbtn, .rowbtn, .movebtn) { visibility: hidden; }
body[data-mode=confidence] :is(.mini, .row-item)[data-signed="0"] { opacity: .45; }

body[data-present=true] header, body[data-present=true] #rail { display: none; }
body[data-present=true] #stage { padding: 0 34px var(--s5); }
body[data-present=true] .card { max-width: 1100px; width: 100%; }
body[data-present=true] #nameIn { font-size: var(--t-hero); max-width: none; }
body[data-present=true] #defEdit { font-size: 21px; }
body[data-present=true] .objhead { margin-bottom: var(--s6); }
body[data-present=true] .cardnav { height: 56px; padding-right: 136px; }
body[data-present=true] .grp-h, body[data-present=true] .sec .sec-h { top: 56px; }
.exit-present { display: none; position: fixed; top: 14px; right: var(--s4); z-index: 30; }
body[data-present=true] .exit-present { display: block; }

/* Present is a clean, read-only look at content — none of the ways to edit
   it should still be sitting on the card. */
body[data-present=true] :is(.btn.add, .addtarget, .lockbtn:not(.on), select.cell.card.unset) {
  display: none;
}

.welcome { max-width: 620px; margin: 8vh auto; text-align: center; }
.welcome h1 { font-size: var(--t-display); margin-bottom: 6px; }
.welcome p { color: var(--dim); }
</style>
</head>
<body>

    <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.5h4.2l1.4 2h7.4v7.5a1 1 0 01-1 1H2.5a1 1 0 01-1-1z"/></svg>

  <div class="seg" id="viewSeg" hidden>
    <button data-view="map" aria-pressed="true">Map</button>

<div class="scrim" id="capScrim">
  <div class="dlg" id="capture" role="dialog" aria-modal="true" aria-label="Capture an object">
    <h2>Capture</h2>
    <p>Type an object's name and press <b>Enter</b> — it opens the object if one already exists,
      or offers to create it if it doesn't. The box clears and keeps focus, so you can capture
      several objects in a row. <b>Escape</b> closes.</p>
    <input class="dlgin" id="capName" list="capNames" placeholder="Object name, then Enter" autocomplete="off">
    <datalist id="capNames"></datalist>
    <div class="acts">
      <span class="captally" id="capTally"></span>
      <button class="btn plain" id="capDone">Done</button>
    </div>
  </div>
</div>

<script type="module">
import {
  parseDocument, serializeDocument, verifyRoundTrip, refreshObjects,
  slug, CARDINALITIES, composeCardinality, parseCardinality,
  signOffCol, addSignOffColumn, isSigned, signRow, unsignRow,
  addObject, removeObject, renameObject, setNote, createNote, backlinks, blankMap,
  moveRow, moveObject, setRowTargets, ensureTable, deriveEdges,
  setNoteLabel, removeNote,
} from './parser.js';

/* ===========================================================================
   fs
   =========================================================================== */
const IDB = 'ooux', STORE = 'kv';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kv(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, mode);
    const req = fn(tx.objectStore(STORE));
    tx.oncomplete = () => res(req && 'result' in req ? req.result : undefined);
    tx.onerror = () => rej(tx.error);
  });
}
const kvGet = (k) => kv('readonly', (s) => s.get(k)).catch(() => undefined);
/**
 * Remembering something is a convenience; whatever the user just asked for is
 * the job. A storage failure — private browsing, blocked site data, a value
 * that will not structured-clone — must never take the folder down with it.
 */
const kvSet = (k, v) => kv('readwrite', (s) => s.put(v, k)).catch(() => undefined);

/** Read access is granted on pick; WRITE needs its own explicit grant. */
async function ensureWritable(handle) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return (await handle.requestPermission(opts)) === 'granted';
}

const fs = {
  async pickFolder() {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    await ensureWritable(dir);
    await kvSet('folder', dir);   // best effort; never blocks the open
    return dir;
  },
  async restoreFolder() {
    const dir = await kvGet('folder');
    if (!dir) return null;
    return (await dir.queryPermission({ mode: 'readwrite' })) === 'granted' ? dir : { needsGrant: dir };
  },
  async listMarkdown(dir) {
    const out = [];
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind === 'file' && name.toLowerCase().endsWith('.md')) out.push({ name, handle });
    }
    return out.sort((a, b) => a.name.localeCompare(b.name));
  },
  async read(handle) { return (await handle.getFile()).text(); },
  async write(handle, text) {
    const w = await handle.createWritable();
    await w.write(text);
    await w.close();
  },
};
async function backup(name, text) {
  const ring = (await kvGet('backup:' + name)) || [];
  ring.unshift({ at: new Date().toISOString(), text });
  await kvSet('backup:' + name, ring.slice(0, 10));
}

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);

/* One glyph set across jobmap, priority-guide and ORCA — same viewBox, same
   stroke weight, same call. Copied rather than shared because these apps have
   no build step and each is a single file you can open anywhere. */
const GLYPH = {
  x: 'M4 4l8 8M12 4l-8 8',
  plus: 'M8 3.5v9M3.5 8h9',
  up: 'M8 12.5v-9M4 7.5L8 3.5l4 4',
  down: 'M8 3.5v9M4 8.5l4 4 4-4',

};
function icon(name, size = 13) {
  return `<svg viewBox="0 0 16 16" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="${GLYPH[name]}"/></svg>`;
}

/* A cell is one line of a markdown table row, so a newline or a bare pipe
   corrupts the file. Sanitise at the commit point, never at render. */
const oneLine = (s) => String(s).replace(/\r?\n+/g, ' ').replace(/\s{2,}/g, ' ').trim();
const cellSafe = (s) => oneLine(s).replace(/(?<!\\)\|/g, '\\|');

/* An annotation row carries no claim, so it can never be signed off. Counting
   them would stop the bar reaching 100% and make the headline wrong. */
const signable = (r) => r.kind !== 'annotation' && r.kind !== 'unknown';

/* Nothing may move under the cursor: hold scroll, focus and selection. */
function keepPlace(fn) {
  const stage = $('stage');
  const y = stage.scrollTop;
  const a = document.activeElement;
  const k = (a && a.dataset && a.dataset.row !== undefined)
    ? { row: a.dataset.row, col: a.dataset.col, card: a.dataset.card, s: a.selectionStart, e: a.selectionEnd }
    : null;
  fn();
  stage.scrollTop = y;
  if (!k) return;
  const el = stage.querySelector(k.card
    ? `[data-row="${k.row}"][data-card="1"]`
    : `.cell[data-row="${k.row}"][data-col="${k.col}"]`);
  if (!el) return;
  el.focus();
  if (k.s != null && el.setSelectionRange) { try { el.setSelectionRange(k.s, k.e); } catch {} }
}

/* Cmd-S must write the field being typed in, not just the model. */
function commitActive() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && typeof a.onchange === 'function') a.onchange({ target: a });
}

/**
 * The one dialog. Everything that used to call the browser's `confirm()` or
 * `prompt()` goes through here instead.
 *
 * Returns a promise. A confirm resolves true or false; a prompt (pass `value`,
 * even an empty string) resolves the typed text or null. Buttons take verbs —
 * "Delete", "Create it", "Overwrite" — because OK and Cancel make you re-read
 * the question to work out which one you want.
 */
let dialogsOpen = 0;
function ask(o) {
  return new Promise((resolve) => {
    dialogsOpen++;
    const prompting = typeof o.value === 'string';
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(o.title)}">` +
      `<h2>${esc(o.title)}</h2>` +
      (o.body ? `<p>${o.body}</p>` : '') +
      (prompting
        ? `<input class="dlgin" value="${esc(o.value)}"${o.placeholder ? ` placeholder="${esc(o.placeholder)}"` : ''}>`
        : '') +
      `<div class="acts">` +
        `<button class="btn plain" data-act="cancel">${esc(o.cancel || 'Cancel')}</button>` +
        (o.alt ? `<button class="btn plain" data-act="alt">${esc(o.alt)}</button>` : '') +
        `<button class="btn ${o.danger ? 'danger' : 'primary'}" data-act="ok">${esc(o.ok || 'OK')}</button>` +
      `</div></div>`;
    document.body.appendChild(scrim);

    const inp = scrim.querySelector('.dlgin');
    const prior = document.activeElement;
    let done = false;
    const close = (v) => {
      if (done) return;
      done = true;
      dialogsOpen--;
      document.removeEventListener('keydown', key, true);
      scrim.remove();
      if (prior && prior.isConnected && prior.focus) prior.focus();
      resolve(v);
    };
    const no = () => close(prompting ? null : false);
    const yes = () => close(prompting ? (oneLine(inp.value).trim() || null) : true);
    const key = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); no(); return; }
      if (e.key !== 'Enter') return;
      const act = document.activeElement && document.activeElement.dataset
        ? document.activeElement.dataset.act : null;
      if (act === 'cancel' || act === 'alt') return;   // let the button take it
      e.preventDefault(); e.stopPropagation(); yes();
    };
    document.addEventListener('keydown', key, true);
    scrim.querySelector('[data-act=cancel]').onclick = no;
    scrim.querySelector('[data-act=ok]').onclick = yes;
    const alt = scrim.querySelector('[data-act=alt]');
    if (alt) alt.onclick = () => close('alt');
    // A click that STARTS on the backdrop dismisses; a drag that ends there
    // after selecting text inside the dialog must not.
    scrim.onmousedown = (e) => { if (e.target === scrim) no(); };

    if (inp) { inp.focus(); inp.select(); }
    else scrim.querySelector('[data-act=ok]').focus();
  });
}

function setStatus() {

function signStats(doc) {
  let signed = 0, total = 0;
  for (const o of doc.objects) {
    if (!o.table) continue;
    const col = signOffCol(o.table);
    for (const r of o.table.rows) { if (!signable(r)) continue; total++; if (isSigned(r, col)) signed++; }
  }
  return { signed, total };
}
const pct = (st) => (st.total ? Math.round((st.signed / st.total) * 100) : 0);
function objSigned(o) {
  if (!o.table) return { signed: 0, total: 0 };
  const col = signOffCol(o.table);
  let s = 0, t = 0;
  for (const r of o.table.rows) { if (!signable(r)) continue; t++; if (isSigned(r, col)) s++; }
  return { signed: s, total: t };
}

function renderHeadline() {
  if (!S.doc) { $('headline').textContent = ''; return; }

function objCounts(obj) {
  const c = { core: 0, meta: 0, nested: 0, action: 0 };
  if (obj.table) for (const r of obj.table.rows) {
    if (r.kind === 'attribute') c[r.slot]++;
    else if (r.kind === 'relationship') c.nested++;
    else if (r.kind === 'action') c.action++;
  }
  return c;
}
