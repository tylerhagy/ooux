<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORCA — OOUX object maps</title>
<style>
:root {
  /* Shared with jobmap and protoserve: one palette across the family. */
  --bg: #f6f7f9; --panel: #fff; --ink: #16181d; --muted: #6b7280; --faint: #9aa1ac;
  --line: rgba(16,18,22,.11); --line-strong: rgba(16,18,22,.2);
  --btn-face: transparent; --btn-face-hover: rgba(16,18,22,.055); --btn-line: transparent;
  --accent: #2563eb; --accent-soft: rgba(37,99,235,.10); --on-accent: #fff;
  --warn: #9a6700; --warn-soft: #fdf8ec;
  --danger: #d0342c; --danger-soft: rgba(208,52,44,.09);
  --signed: #177245; --signed-soft: rgba(23,114,69,.11); --on-signed: #fff;
  --t-micro: 11px; --t-small: 12px; --t-body: 13px; --t-ui: 14px; --t-title: 16px; --t-display: 28px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 28px; --s7: 96px;
  --ctrl-h: 28px; --ctrl-h-sm: 24px; --row-pad-y: 4px;
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #16171a; --panel: #1f2024; --ink: #f5f5f7; --muted: #98989d; --faint: #7c7c84;
    --line: rgba(255,255,255,.13); --line-strong: rgba(255,255,255,.2);
    --btn-face: transparent; --btn-face-hover: rgba(255,255,255,.09); --btn-line: transparent;
    --accent: #0a84ff; --accent-soft: rgba(10,132,255,.16); --on-accent: #fff;
    --warn: #e0b25a; --warn-soft: rgba(224,178,90,.13);
    --danger: #ff453a; --danger-soft: rgba(255,69,58,.14);
    --signed: #30d158; --signed-soft: rgba(48,209,88,.14); --on-signed: #0e1a14;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: var(--t-ui)/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; }

/* controls: one fill, one border, one hover step, one focus ring ----------- */
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell:focus-visible { outline-offset: -2px; }
.btn { background: var(--btn-face); border: 1px solid var(--btn-line); border-radius: 8px;
  height: var(--ctrl-h); padding: 0 11px; font-size: var(--t-small); font-weight: 500;
  color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
  transition: background 140ms cubic-bezier(.22,.61,.36,1), color 140ms cubic-bezier(.22,.61,.36,1); }
.btn:hover { color: var(--ink); }
.btn:hover { background: var(--btn-face-hover); }
.btn:disabled { cursor: default; color: var(--faint); }
.btn.sm { height: var(--ctrl-h-sm); padding: 0 8px; font-size: var(--t-small); }
.btn.add { height: 22px; padding: 0 8px; font-size: var(--t-small); color: var(--muted); }
.btn.add:hover { color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { background: var(--btn-face); border-color: var(--btn-line); color: var(--faint); opacity: 1; }
.btn[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.linkbtn { border: 0; background: none; padding: 0; font-size: var(--t-small); color: var(--faint); }
.linkbtn:hover { color: var(--danger); text-decoration: underline; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--btn-face-hover);
  border: 0; border-radius: 9px; }
.seg button { height: var(--ctrl-h-sm); padding: 0 12px; border: 0; border-radius: 7px;
  background: none; color: var(--muted); font-size: var(--t-small); font-weight: 500; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed=true] { background: var(--panel); color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* header: fixed geometry so it can never change height --------------------- */
header { display: flex; align-items: center; gap: var(--s3); flex-wrap: nowrap;
  min-height: 44px; padding: 8px var(--s4); background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { font-size: var(--t-micro); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.filename { font-weight: 600; color: var(--ink); border: 0; background: none;
  padding: 3px 7px; margin-left: -7px; border-radius: 7px; font-size: var(--t-ui);
  max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filename:hover { background: var(--btn-face-hover); }
.status { flex: none; width: 118px; font-size: var(--t-small); color: var(--muted); }
.status.dirty { color: var(--warn); font-weight: 600; }
.spacer { flex: 1; }
.headline { display: inline-flex; align-items: center; gap: var(--s2); flex: none;
  font-size: var(--t-small); color: var(--muted); font-variant-numeric: tabular-nums; }
.headline b { color: var(--signed); font-weight: 600; }
.headline .sigbar { width: 56px; }

/* banners stay in flow; transient toasts never push the page --------------- */
.banner { padding: 10px var(--s4); font-size: var(--t-body); border-bottom: 1px solid var(--line); position: relative; }
.banner.err { background: var(--danger-soft); color: var(--danger); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.ok { background: var(--signed-soft); color: var(--signed); }
.banner code { font-family: var(--mono); font-size: var(--t-small); }
.banner .x { position: absolute; right: 10px; top: 7px; border: 0; background: none; color: inherit; opacity: .6; }
#toasts { position: fixed; right: var(--s4); bottom: var(--s4); z-index: 40;
  width: min(400px, calc(100vw - 32px)); display: flex; flex-direction: column-reverse;
  gap: var(--s2); pointer-events: none; }
#toasts .banner { pointer-events: auto; border: 1px solid var(--line); border-radius: var(--radius); }

/* layout ------------------------------------------------------------------ */
main { flex: 1; display: flex; min-height: 0; }
#rail { width: 232px; flex: none; border-right: 1px solid var(--line); background: var(--panel);
  overflow-y: auto; padding: 10px; }
#stage { flex: 1; overflow-y: auto; padding: 0 26px var(--s7); }
.rail-h { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: var(--s3) 6px 5px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
.rail-row { display: flex; align-items: center; }
.rail-row .rail-item { flex: 1; min-width: 0; }
.rail-tools { display: flex; flex-direction: column; flex: none; }
.rail-item { display: flex; align-items: center; gap: var(--s2); width: 100%; text-align: left;
  background: none; border: 0; border-radius: 6px; padding: 5px 7px; font-size: var(--t-body); }
.rail-item:hover { background: var(--btn-face); }
.rail-item[aria-current=true] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.rail-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-item .ct { font-size: var(--t-micro); color: var(--faint); font-variant-numeric: tabular-nums; }
.rail-item.muted .nm { color: var(--faint); }

.sigbar { display: flex; height: 3px; overflow: hidden; background: var(--line); }
.sigbar i { display: block; height: 100%; background: var(--signed); }

/* map --------------------------------------------------------------------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--s3); padding-top: var(--s5); }
.mini { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--s3); text-align: left; width: 100%; }
.mini:hover { background: var(--btn-face); border-color: var(--line-strong); }
.mini h4 { margin: 0 0 var(--s1); font-size: var(--t-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .def { font-size: var(--t-small); color: var(--muted); margin: 0 0 10px; min-height: 2.6em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini .counts span { white-space: nowrap; }
.mini .counts { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); margin-top: var(--s2); font-size: var(--t-micro);
  color: var(--faint); font-variant-numeric: tabular-nums; }

/* card: no panel, no boxes — five section rules and one header row --------- */
.card { background: none; border: 0; border-radius: 0; padding: 0; max-width: 1180px; }
.cardnav { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px;
  height: 40px; background: var(--bg); border-bottom: 1px solid var(--line);
  margin: 0 -26px 20px; padding: 0 26px; }
.cardnav .navbtn { width: 26px; height: 26px; padding: 0; justify-content: center; }
.cardnav .pos { font-size: var(--t-small); color: var(--faint); font-variant-numeric: tabular-nums; }
.cardnav .prog { font-size: var(--t-small); color: var(--muted); font-variant-numeric: tabular-nums; }
.cardnav .sigbar { width: 64px; flex: none; }
#nameIn { font-size: var(--t-title); font-weight: 600; letter-spacing: -.01em;
  border: 1px solid transparent; background: none; color: inherit; border-radius: 6px;
  padding: 3px 6px; font-family: inherit; field-sizing: content; min-width: 8ch; max-width: 44ch; width: auto; }
#nameIn:hover { border-color: var(--line); }

.sec { margin-top: var(--s6); padding-top: 14px; border-top: 1px solid var(--line); }
.sec:first-of-type { margin-top: 20px; padding-top: 0; border-top: 0; }
.sec-h { display: flex; align-items: center; gap: var(--s2); margin: 0 0 var(--s2);
  font-size: var(--t-micro); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sec .sec-h { position: sticky; top: 40px; z-index: 2; background: var(--bg); padding: 5px 0; }
.sec-h .ct { color: var(--faint); font-weight: 400; letter-spacing: 0; }
tr, .sec { scroll-margin-top: 76px; }

.ta { width: 100%; border: 1px solid transparent; background: none; border-radius: 6px;
  padding: 6px 8px; margin: 0 -8px; font: inherit; color: inherit; resize: none; }
.ta:hover { border-color: var(--line); }
#defEdit { font-size: var(--t-ui); line-height: 1.55; max-width: 74ch; field-sizing: content; min-height: 2.6em; }
#notesEdit { font-size: var(--t-body); max-width: 74ch; field-sizing: content; min-height: 2.4em; max-height: 12em; }

table.rows { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.rows th { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); text-align: left; font-weight: 600; padding: 0 6px 4px; white-space: nowrap; }
table.rows td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: top; position: relative; }
table.rows tbody tr:first-child td { border-top: 0; }
table.rows td.g-move, table.rows td.g-del, table.rows td.g-sign { padding-left: 0; padding-right: 0; }
/* Hovering a row lights up each editable field SEPARATELY — the gaps between
   them are what make three fields read as three fields and not one strip. */
table.rows tbody tr:hover .cell:not(:disabled) { background: var(--btn-face); }
td.g-move, td.g-del, td.g-sign { padding-top: 5px; }
td.g-sign { text-align: center; }
td.c-name { display: flex; align-items: flex-start; gap: 6px; flex-wrap: nowrap; }
td.c-name .cell { flex: 1 1 auto; min-width: 0; }

.cell { width: 100%; border: 1px solid transparent; background: none; border-radius: 5px;
  padding: var(--row-pad-y) 6px; font: inherit; font-size: var(--t-body); color: inherit; }
.cell:hover:not(:disabled) { background: var(--btn-face-hover); }
.cell:disabled { opacity: 1; color: var(--muted); -webkit-text-fill-color: var(--muted); cursor: default; }
textarea.cell { resize: none; overflow-y: auto; line-height: 1.45; }
@supports (field-sizing: content) {
  textarea.cell { field-sizing: content; }
  /* Notes are NOT capped. A note that scrolls inside a three-line box is a note
     nobody reads — and a note is where the reason for a row lives, so it is the
     part most worth reading. Long rows are the acceptable cost; the alternative
     is hiding the content the map exists to carry. Names stay capped because a
     name that runs past two lines is a name that wants to be a note. */
  textarea.cell.nm { max-height: 2.7em; }
}
/* Example values are DATA, not prose — a real value lifted from the live system.
   Monospace is the point rather than decoration: it is what lets you count the
   digits in an account number and see at a glance whether codes are sequential
   or random. Muted so a populated example never outweighs the name beside it. */
textarea.cell.example { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: var(--t-small); color: var(--muted); }
textarea.cell.example::placeholder { color: var(--line-strong); }
select.cell { appearance: none; width: 100%; text-overflow: ellipsis; color: var(--muted); }
.qualchip { font-size: var(--t-micro); color: var(--muted); padding: 1px 6px; margin-top: 2px;
  border-left: 2px solid var(--line-strong); }

/* row state lives in 2px of left edge, never in the row background -------- */
tr.rowdirty td:first-child::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px;
  width: 2px; border-radius: 1px; background: var(--warn); }
tr.signed .cell { color: var(--muted); }
.lockbtn { width: 20px; height: 20px; padding: 0; border: 1px solid var(--btn-line);
  background: var(--btn-face); border-radius: 4px; color: transparent; font-size: var(--t-micro);
  line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.lockbtn:hover { background: var(--btn-face-hover); }
.lockbtn.on { background: var(--signed); border-color: var(--signed); color: var(--on-signed); }
.lockbtn:disabled { opacity: 1; cursor: default; }
.movebtn { display: block; width: 22px; height: 14px; padding: 0; border: 0; background: none;
  color: var(--faint); font-size: 10px; line-height: 14px; text-align: center; border-radius: 3px; }
.movebtn:hover:not(:disabled) { background: var(--btn-face); color: var(--ink); }
.rowbtn { border: 0; background: none; color: var(--faint); padding: 2px 5px; border-radius: 4px; }
.rowbtn:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }
.movebtn, .rowbtn { opacity: 0; transition: opacity 90ms; }
tr:hover .movebtn, tr:hover .rowbtn, tr:focus-within .movebtn, tr:focus-within .rowbtn,
.rail-row:hover .movebtn, .rail-row:focus-within .movebtn,
.movebtn:focus-visible, .rowbtn:focus-visible { opacity: 1; }
tr:hover .movebtn:disabled, tr:focus-within .movebtn:disabled,
.rail-row:hover .movebtn:disabled { opacity: .25; cursor: default; }
tr.justmoved td { animation: settle .5s ease-out; }
@keyframes settle { from { background: var(--accent-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) {
  tr.justmoved td { animation: none; }
  tr.justmoved td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
}

.chips { display: flex; gap: var(--s1); margin: 0; padding-top: 3px; flex-wrap: wrap; align-items: center; }
td.c-name.rel { flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 1px; font-size: var(--t-micro);
  border-radius: 999px; padding: 1px 2px 1px 8px; border: 1px solid var(--accent);
  color: var(--accent); background: none; white-space: nowrap; }
.chip.ghost { border-color: var(--line-strong); color: var(--faint); border-style: dashed; }
.chip .tlbl { border: 0; background: none; color: inherit; padding: 0; font-size: inherit; }
.chip .tlbl:hover { text-decoration: underline; }
.chip.ghost .tlbl { cursor: default; }
.chip.ghost .tlbl:hover { text-decoration: none; }
.chipx { border: 0; background: none; color: inherit; padding: 0 4px; border-radius: 999px;
  opacity: 0; font-size: inherit; }
tr:hover .chipx, tr:focus-within .chipx, .chipx:focus-visible { opacity: .6; }
.chipx:hover { opacity: 1; background: var(--danger-soft); color: var(--danger); }
.addtarget { width: 20px; height: 18px; padding: 0; border: 1px dashed var(--btn-line);
  background: none; color: var(--faint); border-radius: 999px; font-size: var(--t-micro); line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; }
.addtarget:hover { background: var(--btn-face); color: var(--ink); border-style: solid; }
.tgtinput { font-size: var(--t-micro); border: 1px solid var(--accent); border-radius: 999px;
  padding: 1px 8px; background: var(--bg); color: var(--ink); width: 16ch; font-family: inherit; }
.lbltext { font-size: var(--t-micro); color: var(--muted); }

.notes { border-left: 2px solid var(--line-strong); padding-left: var(--s3); margin: 0; }
.notes .nrow { display: flex; align-items: flex-start; gap: var(--s2); margin-bottom: 2px; }
.notes .nlbl { flex: none; width: 96px; font-size: var(--t-micro); text-transform: uppercase;
  letter-spacing: .06em; font-weight: 600; color: var(--muted); font-family: inherit;
  background: none; border: 1px solid transparent; border-radius: 5px; padding: 3px 5px; }
.notes .nlbl:hover { border-color: var(--line); }
.notes .nlbl:focus { border-color: var(--accent); background: var(--bg); outline: none; }
.notes .ndel { opacity: 0; flex: none; margin-top: 2px; }
.notes .nrow:hover .ndel, .notes .nrow:focus-within .ndel { opacity: .6; }
.notes .nrow:last-child { margin-bottom: 0; }
.notes .nbody { flex: 1; min-width: 0; font-size: var(--t-body); line-height: 1.5;
  field-sizing: content; padding: 2px 6px; margin: 0; }
.notes .lbl { padding-top: 3px; }

.backlink { display: flex; gap: var(--s2); align-items: baseline; padding: 4px 0;
  border-top: 1px solid var(--line); font-size: var(--t-body); }
.backlink button { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; }
.backlink .c { font-size: var(--t-small); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty-note { color: var(--muted); font-size: var(--t-body); }
.cardfoot { display: flex; align-items: flex-start; gap: var(--s4); border-top: 1px solid var(--line-strong);
  margin-top: 32px; padding-top: var(--s4); }
.cardfoot .sec-h { position: static; }

/* graph ------------------------------------------------------------------- */
.gbar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: var(--s2);
  height: 40px; background: var(--bg); border-bottom: 1px solid var(--line);
  margin: 0 -26px var(--s3); padding: 0 26px; }
.gbar select { height: var(--ctrl-h-sm); font: inherit; font-size: var(--t-small); color: var(--ink);
  background: var(--btn-face); border: 1px solid var(--btn-line); border-radius: 6px; padding: 0 6px; }
.gbar .note { font-size: var(--t-small); color: var(--muted); font-variant-numeric: tabular-nums; }
.gwrap { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
svg.graph { display: block; width: 100%; height: 62vh; cursor: grab; touch-action: none; }
svg.graph.drag { cursor: grabbing; }
svg.graph .nd rect { fill: var(--bg); stroke: var(--line-strong); stroke-width: 1; }
svg.graph .nd text { font-size: 12px; fill: var(--ink); }
svg.graph .nd.ghost rect { stroke-dasharray: 3 3; fill: none; }
svg.graph .nd.ghost text { fill: var(--faint); }
svg.graph .nd.sel rect { stroke: var(--accent); stroke-width: 2; fill: var(--accent-soft); }
svg.graph .nd { cursor: pointer; }
svg.graph .nd:hover rect { stroke: var(--accent); }
svg.graph .eg { stroke: var(--line-strong); stroke-width: 1.25; fill: none; }
svg.graph .eg.signed { stroke: var(--signed); stroke-width: 1.75; }
svg.graph .eg.contested { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 5 3; }
svg.graph .gq { font-size: 11px; font-weight: 600; fill: var(--warn); }
svg.graph .gl { stroke: var(--line-strong); stroke-width: 1.25; fill: none; }
svg.graph .gl.open { fill: var(--panel); }
svg.graph .dim { opacity: .18; }
svg.graph .gnote { font-size: 10px; fill: var(--faint); letter-spacing: .06em; text-transform: uppercase; }

/* ---------------------------------------------------------------------------
   The graph is ONE framed instrument: canvas, then a plain-English readout of
   whatever is under the cursor, then a key whose items highlight what they
   describe. A caption stuck underneath a diagram explains nothing; a sentence
   that appears when you point at a thing explains everything.
   --------------------------------------------------------------------------- */
.gframe { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
  overflow: hidden; }
.gbody { overflow: auto; max-height: 70vh; }
.greadout { display: flex; align-items: center; gap: var(--s2); min-height: 34px;
  padding: 6px var(--s3); border-top: 1px solid var(--line); background: var(--bg);
  font-size: var(--t-body); color: var(--ink); }
.greadout .hint { color: var(--muted); }
.greadout b { font-weight: 600; }
.greadout .tag { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .06em;
  border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line-strong); color: var(--muted); }
.greadout .tag.signed { border-color: var(--signed); color: var(--signed); }
.greadout .tag.contested { border-color: var(--warn); color: var(--warn); }
.greadout .tag.open { border-color: var(--line-strong); color: var(--faint); }
.gkey { display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--s1);
  padding: 6px var(--s3) 8px; border-top: 1px solid var(--line); background: var(--panel); }
.gkey .grp { font-size: var(--t-micro); text-transform: uppercase; letter-spacing: .06em;
  color: var(--faint); margin: 0 var(--s2) 0 0; }
.gkey .grp + .grp, .gkey .ki + .grp { margin-left: var(--s4); }
.ki { display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent;
  background: none; border-radius: 999px; padding: 2px 8px; font-size: var(--t-small);
  color: var(--muted); }
.ki:hover, .ki:focus-visible { background: var(--btn-face); color: var(--ink); }
.ki svg { vertical-align: middle; }
.ki svg line { stroke: var(--line-strong); stroke-width: 1.25; }
.ki svg line.sgn { stroke: var(--signed); stroke-width: 1.75; }
.ki svg line.ctd { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 5 3; }

.ki .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px;
  border: 1px solid var(--line-strong); }
.ki .sw.signed { background: var(--signed-soft); border-color: var(--signed); }
.ki .sw.contested { background: var(--warn-soft); border-color: var(--warn); }
.ki .sw.inv { position: relative; background: var(--panel); }
.ki .sw.inv::after { content: ''; position: absolute; inset: 0; margin: auto; width: 4px; height: 4px;
  border-radius: 50%; border: 1px solid var(--line-strong); }
.ki .tok { font-weight: 700; color: var(--ink); min-width: 12px; text-align: center; }

/* pointing at a key item dims everything it does not describe */
.gframe[data-hl] td.mx, .gframe[data-hl] td.inverse,
.gframe[data-hl] .eg, .gframe[data-hl] .gl, .gframe[data-hl] .nd { opacity: .16; }
.gframe[data-hl=signed] td.mx.signed, .gframe[data-hl=signed] .eg.signed { opacity: 1; }
.gframe[data-hl=contested] td.mx.contested, .gframe[data-hl=contested] .eg.contested { opacity: 1; }
.gframe[data-hl=inverse] td.inverse { opacity: 1; }
.gframe[data-hl=ghost] .nd.ghost { opacity: 1; }
.gframe[data-hl=open] .gl.open { opacity: 1; }
.gframe[data-hl=one] .gl.one { opacity: 1; }
.gframe[data-hl=many] .gl.many { opacity: 1; }
.gframe[data-hl=stated] td.mx:not(.signed):not(.contested),
.gframe[data-hl=stated] .eg:not(.signed):not(.contested) { opacity: 1; }

/* grid: a real matrix — one shared rule between cells, sticky headers, and a
   crosshair so a row can be tracked across sixteen columns. ---------------- */
table.gmx { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 0 auto; }
table.gmx th, table.gmx td { border: 0; }
table.gmx thead th { position: sticky; top: 0; z-index: 2; background: var(--panel);
  vertical-align: bottom; padding: 0; }
table.gmx th.corner { left: 0; z-index: 4; background: var(--panel); }
table.gmx th.vh { width: 30px; height: 156px; }
table.gmx th.vh span { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg);
  font-size: var(--t-micro); font-weight: 600; color: var(--muted); padding: 8px 0 6px;
  max-height: 148px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.gmx th.vh.ghost span { color: var(--faint); font-weight: 400; }
table.gmx th.rh { position: sticky; left: 0; z-index: 3; background: var(--panel);
  text-align: left; font-weight: 400; padding: 0;
  border-right: 1px solid var(--line-strong); }
table.gmx th.rh button { border: 0; background: none; color: var(--ink); font: inherit;
  font-size: var(--t-body); padding: 0 var(--s3) 0 10px; height: 30px; width: 100%;
  max-width: 210px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.gmx th.rh button:hover { color: var(--accent); }
table.gmx thead th.vh { border-bottom: 1px solid var(--line-strong); }

  color: var(--faint); box-shadow: inset -1px -1px 0 var(--line); }
table.gmx td.mx { color: var(--accent); font-weight: 700; background: var(--accent-soft); }
table.gmx td.mx.signed { background: var(--signed-soft); color: var(--signed); }
table.gmx td.mx.contested { background: var(--warn-soft); color: var(--warn); }
table.gmx td.self { background: var(--bg); }
table.gmx td.inverse::after { content: ''; display: block; width: 5px; height: 5px; margin: 0 auto;
  border-radius: 50%; border: 1px solid var(--line-strong); }
/* crosshair, driven by data attributes set on hover */
table.gmx[data-r] tbody tr[data-row] { background: none; }
table.gmx tbody tr.xrow { background: color-mix(in srgb, var(--btn-face) 46%, transparent); }
table.gmx tbody tr.xrow th.rh { background: var(--btn-face); }
table.gmx col.xcol { background: color-mix(in srgb, var(--btn-face) 46%, transparent); }
table.gmx thead th.xhead span { color: var(--ink); }

pre.source { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--s4) 18px; overflow-x: auto; font-family: var(--mono); font-size: var(--t-small);
  line-height: 1.65; margin: 0; }
pre.source .ln { color: var(--faint); user-select: none; display: inline-block; width: 3.2em; }
pre.source mark { background: var(--accent-soft); color: inherit; }

/* "what have we signed off on?" — dim, do not erase ----------------------- */
body[data-mode=confidence] tr:not(.signed) { opacity: .45; }

body[data-mode=confidence] tr:not(.signed) :is(.lockbtn, .rowbtn, .movebtn) { visibility: hidden; }
body[data-mode=confidence] .mini[data-signed="0"] { opacity: .45; }

body[data-present=true] header, body[data-present=true] #rail { display: none; }

</style>
